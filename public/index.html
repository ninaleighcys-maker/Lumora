function resizeImage(file,maxSize=1200,quality=.72){
  return new Promise((resolve,reject)=>{
    if(!file) return resolve('');

      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale));
        const h=Math.max(1,Math.round(img.naturalHeight*scale));

        resolve(canvas.toDataURL('image/jpeg',quality));

      img.onerror=()=>reject(new Error('Could not read that image.'));
      img.src=reader.result;
    };

  });

function openCropper(file,type){
  return new Promise((resolve,reject)=>{
    if(!file)return resolve('');
    if(!/^image\/(png|jpe?g|webp)$/i.test(file.type||''))return reject(new Error('Please choose a PNG, JPG, or WEBP image.'));
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Could not read that image.'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Could not decode that image.'));
      img.onload=()=>{
        const avatar=type==='avatar',aspect=avatar?1:3.2;
        const W=avatar?512:1400,H=Math.round(W/aspect);
        let zoom=1,baseScale=Math.max(W/img.naturalWidth,H/img.naturalHeight),scale=baseScale;
        let ox=(W-img.naturalWidth*scale)/2,oy=(H-img.naturalHeight*scale)/2;
        const m=document.createElement('div');m.className='modal crop-modal';
        m.innerHTML='<div class="modalbox"><h2>'+ (avatar?'Adjust Profile Picture':'Adjust Cover Photo') +'</h2><p class="crop-hint">Drag the image to reposition it. Use the slider to zoom. The visible area is exactly what will be saved.</p><div class="crop-stage-wrap"><canvas id="cropCanvas" class="crop-stage" width="'+W+'" height="'+H+'"></canvas></div><div class="crop-controls"><label>Zoom</label><input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1"><span id="cropZoomValue">1.00×</span></div><div class="row"><button id="useCrop">Use This Crop</button><button class="secondary" id="cancelCrop">Cancel</button></div></div>';
        document.body.appendChild(m);
        const canvas=m.querySelector('#cropCanvas'),ctx=canvas.getContext('2d');
        const draw=()=>{scale=baseScale*zoom;ctx.clearRect(0,0,W,H);ctx.fillStyle='#101014';ctx.fillRect(0,0,W,H);ctx.drawImage(img,ox,oy,img.naturalWidth*scale,img.naturalHeight*scale);};
        draw();
        let dragging=false,sx=0,sy=0,startX=0,startY=0;
        canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;startX=ox;startY=oy});
        canvas.addEventListener('pointermove',e=>{if(!dragging)return;const rect=canvas.getBoundingClientRect();const dx=(e.clientX-sx)*(W/rect.width),dy=(e.clientY-sy)*(H/rect.height);ox=startX+dx;oy=startY+dy;draw()});
        const stop=e=>{dragging=false;canvas.classList.remove('dragging');try{canvas.releasePointerCapture(e.pointerId)}catch(_){}};
        canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
        m.querySelector('#cropZoom').addEventListener('input',e=>{
          const next=Number(e.target.value),cx=W/2,cy=H/2,oldScale=scale;zoom=next;const newScale=baseScale*zoom;
          ox=cx-(cx-ox)*(newScale/oldScale);oy=cy-(cy-oy)*(newScale/oldScale);
          m.querySelector('#cropZoomValue').textContent=next.toFixed(2)+'×';draw();
        });
        m.querySelector('#cancelCrop').onclick=()=>{m.remove();resolve('')};
        m.querySelector('#useCrop').onclick=()=>{
          const out=document.createElement('canvas');out.width=W;out.height=H;const oc=out.getContext('2d');
          oc.fillStyle='#101014';oc.fillRect(0,0,W,H);oc.drawImage(canvas,0,0);
          const data=out.toDataURL('image/jpeg',.88);m.remove();resolve(data);
        };
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function previewAvatar(input){
  const file=input.files?.[0];if(!file)return;
  openCropper(file,'avatar').then(src=>{
    if(!src)return;
    const hidden=document.getElementById('pfAvatar');if(hidden){hidden.value=src;hidden.dataset.cropped='1'}
    const el=document.getElementById('profileAvatarPreview');if(el)el.innerHTML='<img class="profile-avatar-img profile-clickable" src="'+attr(src)+'" alt="Avatar preview" onclick="openImageLightbox(this.currentSrc||this.src);event.stopPropagation()">';
  }).catch(e=>alert(e.message));
}
function previewCover(input){
  const file=input.files?.[0];if(!file)return;
  openCropper(file,'cover').then(src=>{
    if(!src)return;
    const hidden=document.getElementById('pfCover');if(hidden){hidden.value=src;hidden.dataset.cropped='1'}
    const el=document.getElementById('profileCoverPreview');if(el)el.innerHTML='<img class="upload-preview cover-view-image profile-clickable" style="max-width:100%;width:100%;height:180px;object-fit:cover" src="'+attr(src)+'" alt="Cover preview" onclick="openImageLightbox(this.currentSrc||this.src)">';
  }).catch(e=>alert(e.message));
}

async function saveProfile(){
  try{
    const username=String(document.getElementById('pfUsername')?.value||'').trim().toLowerCase(),changing=username!==String(me.username||'').toLowerCase();
    if(changing&&!document.getElementById('pfPassword')?.value){alert('Enter your current password to change your username.');return}
    let avatarUrl=document.getElementById('pfAvatar')?.value.trim()||me.avatarUrl||'';
    let coverUrl=document.getElementById('pfCover')?.value.trim()||me.coverUrl||'';
    const af=document.getElementById('pfAvatarFile')?.files?.[0],cf=document.getElementById('pfCoverFile')?.files?.[0];
    if(af&&!document.getElementById('pfAvatar')?.dataset.cropped)avatarUrl=await resizeImage(af,700,.84);
    if(cf&&!document.getElementById('pfCover')?.dataset.cropped)coverUrl=await resizeImage(cf,1600,.84);
    const payload={name:document.getElementById('pfName').value,username,bio:document.getElementById('pfBio').value,avatarUrl,coverUrl,favoriteQuote:document.getElementById('pfQuote').value,accountPrivacy:document.getElementById('pfPrivacy').value,messagePermission:document.getElementById('pfMessages').value,theme:me.theme||'Rose'};
    if(changing)payload.currentPassword=document.getElementById('pfPassword').value;
    const r=await api('/api/profile',{method:'PUT',body:JSON.stringify(payload)});me=r.user;
    window.currentProfileModal?.remove();state.view='profile';await dashboard();await render();
  }catch(e){alert(e.message)}
}

function inboxBubble(m){return '<div class="chat-bubble '+(m.fromId===me.id?'mine':'theirs')+'"><div>'+esc(m.content)+'</div><span class="small muted">'+new Date(m.createdAt).toLocaleString([], {hour:'numeric',minute:'2-digit'})+'</span></div>'}
async function inboxPage(selectedId){
  try{
    const [x,social]=await Promise.all([api('/api/messages'),api('/api/social')]);
    state.social=social;
    const conversations=x.conversations||[];
    let selected=conversations.find(c=>c.user?.id===selectedId);
    if(selectedId&&!selected){try{const one=await api('/api/messages/'+selectedId);selected={user:one.user,lastMessage:one.messages?.at(-1),unreadCount:0}}catch(e){}}
    const list=conversations.map(c=>'<div class="inbox-item '+(selected?.user?.id===c.user?.id?'active':'')+'" onclick="openInboxChat(\''+attr(c.user.id)+'\')">'+inboxAvatar(c.user)+'<div class="inbox-preview"><b>'+esc(c.user.name||('@'+c.user.username))+'</b><div class="muted small">'+esc(c.lastMessage?.content||'')+'</div></div>'+(c.unreadCount?'<span class="inbox-unread">'+(c.unreadCount>99?'99+':c.unreadCount)+'</span>':'')+'</div>').join('')||'<p class="empty muted">No conversations yet.</p>';
    let main='<div class="card empty muted">Select a conversation to start messaging.</div>';
    if(selected?.user?.id){
      const chat=await api('/api/messages/'+selected.user.id);
      main='<div class="card"><div class="chat-head" onclick="openUser(\''+attr(chat.user.id)+'\')">'+inboxAvatar(chat.user)+'<div><h2 style="margin:0">'+esc(chat.user.name||('@'+chat.user.username))+'</h2><div class="muted small">@'+esc(chat.user.username)+' · View profile</div></div></div><div id="chatMessages" class="chat-messages">'+(chat.messages||[]).map(inboxBubble).join('')+'</div><div class="chat-compose"><textarea id="chatText" placeholder="Write a message..."></textarea><button id="chatSend" onclick="sendInboxMessage(\''+attr(chat.user.id)+'\')">Send</button></div></div>';
    }
    const requests=(social.messageRequests||[]).map(r=>'<div class="message-request-item">'+inboxAvatar(r.from)+'<div class="request-body"><b>@'+esc(r.from.username)+'</b><div class="small muted">'+esc(r.message)+'</div></div><div class="request-actions"><button onclick="handleInboxMessageRequest(\''+attr(r.id)+'\',\'accept\')">Accept</button><button class="secondary" onclick="handleInboxMessageRequest(\''+attr(r.id)+'\',\'decline\')">Decline</button></div></div>').join('')||'<p class="empty muted">No pending message requests.</p>';
    app.innerHTML=shell('<section class="hero"><div class="hero-kicker">Your private corner</div><h1>💌 Inbox</h1><p>Your conversations are saved to Lumora.</p></section><div class="inbox-layout"><aside class="card inbox-sidebar"><section class="message-request-panel"><h3>Message Requests</h3>'+requests+'</section><h3>Conversations</h3>'+list+'</aside><main>'+main+'</main></div>');
    const box=document.getElementById('chatMessages');if(box)box.scrollTop=box.scrollHeight;
  }catch(e){app.innerHTML=shell('<div class="card notice">'+esc(e.message)+'</div>')}
}
function openInboxChat(id){state.view='inbox';inboxPage(id)}
async function handleInboxMessageRequest(id,action){try{const r=await api('/api/message-requests/'+id+'/'+action,{method:'POST'});await inboxPage(action==='accept'?r.conversationWith:null)}catch(e){alert(e.message)}}
async function respondToProfileFollowRequest(id,action,userId){try{await api('/api/follow-requests/'+id+'/'+action,{method:'POST'});const banner=document.getElementById('followRequestBanner');if(banner)banner.remove();await refreshNotificationCount();const x=await api('/api/users/'+userId);state.profile=x;userPage()}catch(e){alert(e.message)}}
async function sendInboxMessage(id){const el=document.getElementById('chatText'),btn=document.getElementById('chatSend'),value=String(el?.value||'').trim();if(!value||!btn)return;btn.disabled=true;try{const r=await api('/api/messages/'+id,{method:'POST',body:JSON.stringify({content:value,clientMessageId:crypto.randomUUID()})});if(r.request){await inboxPage(id);return}el.value='';const box=document.getElementById('chatMessages');if(box){box.insertAdjacentHTML('beforeend',inboxBubble(r.message));box.scrollTop=box.scrollHeight}}catch(e){if(e?.message==="You can't message this person"){const box=document.getElementById('chatMessages');if(box)box.insertAdjacentHTML('beforeend','<div class="message-blocked">You can\'t message this person.</div>');const compose=document.querySelector('.chat-compose');if(compose)compose.innerHTML='<div class="message-blocked" style="width:100%">You can\'t message this person.</div>';}else alert(e.message)}finally{btn.disabled=false}}
function shell(content){const v=state.view;return `<div class="app"><nav class="nav"><div class="brand"><img class="brand-logo" src="/logo.svg" alt="Lumora logo"><span>Lumora</span></div><div class="searchbar"><input id="globalSearch" placeholder="Search books, people, diaries..." value="" onkeydown="if(event.key==='Enter')doSearch(this.value)"><button onclick="doSearch(document.getElementById('globalSearch').value)">Search</button></div><div class="navlinks"><button class="${v==='home'?'active':''}" onclick="go('home')">Home</button><button class="${v==='news'?'active':''}" onclick="go('news')">News Feed</button><button class="${v==='discover'?'active':''}" onclick="go('discover')">Discovery</button><button class="${v==='chika'?'active':''}" onclick="go('chika')">Chika</button><button class="${v==='library'?'active':''}" onclick="go('library')">My Books</button><button class="${v==='profile'?'active':''}" onclick="go('profile')">Profile</button><button class="notification-btn" onclick="openNotifications()" title="Notifications">🔔${state.notificationCount?`<span class="notification-badge">${state.notificationCount>99?'99+':state.notificationCount}</span>`:''}</button><button class="${v==='inbox'?'active':''}" onclick="go('inbox')">💌 Inbox</button><button class="${v==='settings'?'active':''}" onclick="go('settings')">⚙ Settings</button><button onclick="logout()">Log out</button></div></nav>${content}</div>`}
async function start(){
  app.innerHTML='<div class="app"><section class="hero"><div class="hero-kicker">Just a moment</div><h1>Opening Lumora ✨</h1><p id="bootMessage">Connecting to your Lumora space…</p></section></div>';
  for(let attempt=0;attempt<12;attempt++){
    try{
      const label=document.getElementById('bootMessage');
      if(label)label.textContent=attempt?'Still connecting to Lumora…':'Connecting to your Lumora space…';
      await api('/api/health',{timeoutMs:6000});
      if(label)label.textContent='Loading your account…';
      const x=await api('/api/me',{timeoutMs:10000});
      me=x.user;
      if(me)applyTheme();
      if(!me)return auth();
      if(!me.emailVerified)return verificationPage();
      await dashboard();
      if(state.view==='reader'){
        const savedReader=localStorage.getItem('lumora-reader-location');
        if(savedReader){
          try{const loc=JSON.parse(savedReader);if(loc?.bookId&&loc?.chapterId)await openChapter(loc.bookId,loc.chapterId)}
          catch(e){localStorage.removeItem('lumora-reader-location')}
        }
      }
      return;
    }catch(e){
      const label=document.getElementById('bootMessage');
      if(label)label.textContent=attempt<11?'Lumora is waking up. Retrying…':'Lumora could not reach the server.';
      if(attempt<11)await new Promise(r=>setTimeout(r,1500));
    }
  }
  app.innerHTML='<div class="app"><section class="hero"><div class="hero-kicker">Lumora</div><h1>We could not connect yet.</h1><p>Your data was not changed. The server may still be starting.</p><button onclick="start()">Try Again</button></section></div>';
}
async function openNotifications(){
  try{
    const x=await api('/api/notifications');
    state.notificationCount=x.unread||0;
    const m=modal(`<button class="notification-close" aria-label="Close" onclick="this.closest('.modal').remove()">×</button><div class="notification-panel"><div class="home-section-head"><div><h2>🔔 Notifications</h2><p class="muted">Follows, messages, and book-library activity.</p></div><button class="secondary" onclick="markAllNotificationsRead()">Mark all read</button></div>${x.notifications.map(n=>`<div class="notification-item ${n.readAt?'':'unread'}" onclick="readNotification('${n.id}',this)"><div class="row"><b>${esc(n.actor?.name||n.actor?.username||'Someone')}</b><span class="muted small">${new Date(n.createdAt).toLocaleString()}</span></div><p>${esc(n.message)}</p>${n.readAt?'':'<span class="pill">New</span>'}</div>`).join('')||'<div class="card empty muted">You have no notifications yet.</div>'}</div>`);
  }catch(e){alert(e.message)}
}
async function readNotification(id,el){try{const r=await api('/api/notifications/'+id,{method:'POST'});el?.classList.remove('unread');await refreshNotificationCount();const n=r.notification;if(!n)return;const t=n.targetType,tid=n.targetId;document.querySelector('.modal')?.remove();if(t==='chapter'&&n.message?.toLowerCase().includes('chapter')){if(n.bookId){await openChapter(n.bookId,tid);return}const found=state.data?.continueReading?.find(b=>b.chapters?.some(c=>c.id===tid));if(found){await openChapter(found.id,tid);return}}if(t==='post'){await openPost(tid);return}if(t==='diary'){await openDiary(tid);return}if(t==='book'){await openBookDetail(tid);return}if(t==='user'){openUser(tid);return}}catch(e){alert(e.message)}}
async function markAllNotificationsRead(){try{await api('/api/notifications/read-all',{method:'POST'});await refreshNotificationCount();document.querySelectorAll('.notification-item.unread').forEach(x=>x.classList.remove('unread'));}catch(e){alert(e.message)}}

function auth(){app.innerHTML=`<div class="app"><section class="hero"><div class="hero-kicker">Your creative space</div><h1>A place for every<br>story you carry.✨</h1><p>Write, read, keep a diary, and find stories from people like you.</p></section><div class="auth card"><h1><img class="brand-logo" src="/logo.svg" alt=""> Lumora</h1><p class="muted">A place for every story you carry.✨</p><div id="authbox"></div></div></div>`;loginForm()}
function loginForm(){document.getElementById('authbox').innerHTML=`<h2>Welcome back</h2><div class="field"><label>Email or username</label><input id="u" autocomplete="username"></div><div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div><button onclick="login()">Log in</button><div style="display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;text-align:center"><a href="#" style="color:var(--accent);font-weight:700;text-decoration:underline" onclick="forgotPasswordForm();return false">Forgot Password?</a><span class="muted">|</span><span class="muted">New here?</span><a href="#" style="color:var(--accent);font-weight:600;text-decoration:underline" onclick="signupForm();return false">Create an account</a></div>`}

function forgotPasswordForm(){document.getElementById('authbox').innerHTML=`<h2>Forgot your password?</h2><p class="muted">Enter your email or username. We will send a 6-digit password reset code.</p><div class="field"><label>Email or username</label><input id="forgotIdentifier" autocomplete="username email"></div><button onclick="requestPasswordReset()">Send reset code</button><p class="small"><a href="#" onclick="loginForm();return false">Back to log in</a></p>`}

async function requestPasswordReset(){try{const identifier=String(document.getElementById('forgotIdentifier')?.value||'').trim();if(!identifier)return alert('Please enter your email or username.');window.resetIdentifier=identifier;const x=await api('/api/forgot-password',{method:'POST',body:JSON.stringify({identifier})});resetPasswordCodeForm(x.previewCode)}catch(e){alert(e.message)}}

function resetPasswordCodeForm(previewCode=''){document.getElementById('authbox').innerHTML=`<h2>Enter reset code</h2><p class="muted">Enter the 6-digit code sent to your email, then choose a new password.</p><div class="field"><label for="resetCode">Password reset code</label><input id="resetCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,6)" onkeydown="if(event.key==='Enter')verifyResetCode()"></div><button onclick="verifyResetCode()">Verify Code</button><p class="small"><a href="#" onclick="forgotPasswordForm();return false">Use a different email/username</a></p>${previewCode?`<p class="small"><b>Local development preview code:</b> ${esc(previewCode)}</p>`:''}`}

async function verifyResetCode(){try{const code=String(document.getElementById('resetCode')?.value||'').replace(/\\D/g,'');if(code.length!==6)return alert('Please enter the 6-digit password reset code.');window.resetCode=code;await api('/api/verify-password-reset-code',{method:'POST',body:JSON.stringify({identifier:window.resetIdentifier,code})});newPasswordForm()}catch(e){alert(e.message)}}

function newPasswordForm(){document.getElementById('authbox').innerHTML=`<h2>Create a new password</h2><p class="muted">Your reset code is verified. Choose a new password for your Lumora account.</p><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" onkeydown="if(event.key==='Enter')finishPasswordReset()"></div><button onclick="finishPasswordReset()">Reset Password</button><p class="small"><a href="#" onclick="loginForm();return false">Back to log in</a></p>`}

async function finishPasswordReset(){try{const password=document.getElementById('newPassword')?.value||'';const confirm=document.getElementById('confirmPassword')?.value||'';if(password.length<8)return alert('Password must be at least 8 characters.');if(password!==confirm)return alert('Passwords do not match.');await api('/api/reset-password',{method:'POST',body:JSON.stringify({identifier:window.resetIdentifier,code:window.resetCode,password})});window.resetIdentifier=null;window.resetCode=null;alert('Your password has been reset. You can now log in with your new password.');loginForm()}catch(e){alert(e.message)}}

function signupForm(){document.getElementById('authbox').innerHTML=`<h2>Create your account</h2><div class="field"><label>Name</label><input id="n"></div><div class="field"><label>Email</label><input id="e" type="email" autocomplete="email"></div><div class="field"><label>Username</label><input id="u" autocomplete="username" minlength="3" maxlength="25"><p class="small muted">3–25 characters. Letters, numbers, and underscores.</p></div><div class="field"><label>Password (8+ characters)</label><input id="p" type="password" autocomplete="new-password"></div><button onclick="signup()">Sign up</button><p class="small">Already have an account? <a href="#" onclick="loginForm();return false">Log in</a></p>`}

async function login(){try{const x=await api('/api/login',{method:'POST',body:JSON.stringify({identifier:u.value,password:p.value})});me=x.user;applyTheme();await dashboard()}catch(e){alert(e.message)}}

async function signup(){try{const x=await api('/api/signup',{method:'POST',body:JSON.stringify({name:n.value,email:e.value,username:u.value,password:p.value})});me=x.user;verificationPage(x.previewCode)}catch(e){alert(e.message)}}

function verificationPage(preview){app.innerHTML=`<div class="app"><div class="auth card"><h1>✉ Verify your email</h1><p>We sent a <b>6-digit verification code</b> to <b>${esc(me.email||'your email')}</b>.</p><div class="verify"><p>Enter the code from your email below to verify your account.</p><div class="field"><label for="verificationCode">Verification Code</label><input id="verificationCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,6)" onkeydown="if(event.key==='Enter')verifyEmailCode()"></div><button onclick="verifyEmailCode()">Verify Code</button><p class="small" style="margin-top:12px">Code expired or not received? <a href="#" onclick="resendVerification();return false">Send me a new code</a></p>${preview?`<p class="small"><b>Local development preview code:</b> ${esc(preview)}</p>`:''}</div><br><button class="secondary" onclick="logout()">Log out</button></div></div>`}

async function verifyEmailCode(){try{const x=document.getElementById('verificationCode');const code=String(x?.value||'').replace(/\D/g,'');if(code.length!==6)return alert('Please enter the 6-digit verification code.');const r=await api('/api/verify-email-code',{method:'POST',body:JSON.stringify({code})});me=r.user;applyTheme();await dashboard()}catch(e){alert(e.message)}}

async function resendVerification(){try{const x=await api('/api/resend-verification',{method:'POST'});if(x.previewCode)verificationPage(x.previewCode);else alert('Verification email sent.')}catch(e){alert(e.message)}}
async function logout(){await api('/api/logout',{method:'POST'});me=null;auth()}
async function refreshNotificationCount(){try{const x=await api('/api/notifications');state.notificationCount=x.unread||0;const btn=document.querySelector('.notification-btn');if(btn){let badge=btn.querySelector('.notification-badge');if(state.notificationCount&&!badge){badge=document.createElement('span');badge.className='notification-badge';btn.appendChild(badge)}if(badge){badge.textContent=state.notificationCount>99?'99+':String(state.notificationCount);badge.style.display=state.notificationCount?'block':'none'}}}catch(e){state.notificationCount=0}}
async function dashboard(){const x=await api('/api/dashboard');state.data=x;state.libraryBooks=x.libraryBooks||[];const allowed=['home','news','discover','chika','library','profile','settings','inbox','reader','bookDetail','post','diary','search','user'];if(!state._initialDashboardDone){const saved=localStorage.getItem('lumora-last-section');state.view=allowed.includes(saved)?saved:'home';state._initialDashboardDone=true;}else if(!allowed.includes(state.view)){state.view='home';}await refreshNotificationCount();render()}
setInterval(()=>{if(me&&me.emailVerified&&!document.hidden)refreshNotificationCount()},60000);
function go(v){saveReaderPosition();state.view=v;try{localStorage.setItem('lumora-last-section',v)}catch(e){}render()}
async function render(){if(!me)return auth();if(state.view==='home')return home();if(state.view==='news')return news();if(state.view==='discover')return discover();if(state.view==='chika')return chika();if(state.view==='library')return library();if(state.view==='profile')return profile();if(state.view==='reader')return reader();if(state.view==='bookDetail')return bookDetailPage();if(state.view==='post')return postPage();if(state.view==='diary')return diaryPage();if(state.view==='search')return searchPage();if(state.view==='user')return userPage();if(state.view==='settings')return settingsPage();if(state.view==='social')return socialPage();if(state.view==='message')return messagePage();if(state.view==='inbox')return inboxPage();return home()}
async function home(){const d=state.data||{books:[],diaries:[],posts:[],continueReading:[],libraryBooks:[]};const recentDiary=[...(d.diaries||[])].sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt))[0];const recentPost=[...(d.posts||[])].sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt))[0];const continueBooks=d.continueReading||[];const libraryBooks=d.libraryBooks||[];app.innerHTML=shell(`<section class="hero"><div class="hero-copy"><div class="hero-kicker">Your creative space</div><h1>A place for every<br>story you carry.✨</h1><p>Write a book, keep a diary, share a thought, or disappear into someone else's story.<br>Lumora brings writing, reading, and memories together.</p><div class="top-actions home-actions"><button onclick="newBook()">📖 Write a Book</button><button class="secondary" onclick="newDiary()">📔 Open Diary</button><button class="secondary" onclick="newPost()">💌 Share a Thought</button></div></div></section><section class="home-section"><div class="home-section-head"><div><h2>Continue Reading</h2><p class="muted">Return to stories you've actually started.</p></div><button class="ghost" onclick="go('library')">View all books →</button></div><div class="continue-grid">${continueBooks.map(b=>`<div class="card home-book"><div class="book-cover small-book-cover">${b.cover?`<img src="${attr(b.cover)}" alt="Book cover">`:`<div class="book-cover-placeholder">${esc(b.title||'Untitled book')}</div>`}</div><div class="meta"><span class="pill">${b.visibility==='public'?'🌎 Public':'🔒 Only Me'}</span><span class="muted small">Page ${b.pageNumber||1} of ${b.chapters.length}</span></div><h3>${esc(b.title||'Untitled book')}</h3><p>${esc(shortDescription(b.description||'A story waiting for you.',35))}</p><button onclick="openBookDetail('${b.id}')">View Book</button></div>`).join('')||`<div class="card empty muted">You haven't started a story yet.</div>`}</div></section><section class="home-section"><div class="home-section-head"><div><h2>My Library</h2><p class="muted">Stories you've saved. Saving a book does not start reading it.</p></div><button class="ghost" onclick="go('library')">View library →</button></div><div class="library-grid">${libraryBooks.map(publicBookCard).join('')||`<div class="card empty muted">Your library is empty. Add a story to keep it here.</div>`}</div></section><section class="home-section"><div class="home-section-head"><div><h2>Your little corner</h2><p class="muted">Small things you've left behind in Lumora.</p></div></div><div class="grid"><div class="card quick-card"><div class="quick-icon">📔</div><div><b>Diary</b><p class="muted small">${recentDiary?`Last entry: ${esc(recentDiary.title||'Untitled')}`:'Write down what today felt like.'}</p><button class="secondary" onclick="newDiary()">Write in diary</button></div></div><div class="card quick-card"><div class="quick-icon">💌</div><div><b>Thoughts</b><p class="muted small">${recentPost?`Last thought: ${esc((recentPost.content||'').slice(0,70))}${(recentPost.content||'').length>70?'…':''}`:'Leave a little thought for your future self.'}</p><button class="secondary" onclick="newPost()">Share a thought</button></div></div><div class="card quick-card"><div class="quick-icon">✦</div><div><b>Profile</b><p class="muted small">Make your corner of Lumora feel like yours.</p><button class="secondary" onclick="go('profile')">View profile</button></div></div></div></section><section class="home-section"><div class="home-note">“There is always room for one more story.”<br><span class="muted small">Your Lumora space is yours to fill, one page at a time.</span></div></section>`)}
async function news(){try{const x=await api('/api/feed');app.innerHTML=shell(`<section class="hero news-hero"><div class="hero-kicker">A little corner of today</div><h1>News Feed ✨</h1><p class="news-intro">Fresh public thoughts from the Lumora community. A public thought stays here for 24 hours before it moves quietly into your Archive Thoughts.</p><div class="archive-note">💌 <b>Share a Thought</b> whenever you want to leave a little piece of today behind. You choose who can see it.</div><button onclick="newPost()">💌 Share a Thought</button></section><div class="news-feed"><section class="section"><div class="home-section-head"><div><h2>Fresh Thoughts</h2><p class="muted">Public thoughts shared within the last 24 hours.</p></div></div>${x.posts.map(p=>`<div class="card news-post"><div class="meta"><span class="pill">💌 Public Thought</span><span class="muted small">by <span class="link" onclick="openUser('${p.author.id}')">@${esc(p.author.username)}</span></span><span class="muted small">${new Date(p.createdAt).toLocaleString()}</span></div><p class="post-body">${esc(p.content)}</p><p class="muted small">${p.commentCount||0} comment(s)</p><div class="post-actions"><button onclick="togglePostLike('${p.id}',${!!p.liked},'news')">${p.liked?'♥ Liked':'♡ Like'} · ${p.likesCount||0}</button><button class="secondary" onclick="toggleRepost('${p.id}','news',${!!p.reposted})">${p.reposted?'✓ Reposted':'↻ Repost'}</button><button class="secondary" onclick="openPost('${p.id}')">Open</button></div></div>`).join('')||'<div class="card empty muted">No fresh public thoughts right now.</div>'}</section></div>`)}catch(e){alert(e.message)}}
async function discover(){try{const x=await api('/api/discover/books');renderDiscovery(x)}catch(e){alert(e.message)}}
function renderDiscovery(x){const rec=x.recommendations||[];const groups=(x.genres||GENRES).map(g=>({genre:g,books:(x.books||[]).filter(b=>b.genre===g)})).filter(g=>g.books.length);app.innerHTML=shell(`<section class="hero"><h1>🔎 Discovery</h1><p>Discover public Books by genre, tags, title, or author.</p><div class="two-col"><div class="field"><label>Search Books</label><input id="dq" placeholder="Search title, author, tags..." onkeydown="if(event.key==='Enter')filterDiscovery()"></div><div class="field"><label>Genre</label><select id="dg"><option value="">All genres</option>${GENRES.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div></div><button onclick="filterDiscovery()">Find Books</button></section><div id="discoverResults">${rec.length?`<section class="section"><div class="home-section-head"><div><h2>Recommendation</h2><p class="muted">Stories surfaced from the available reader engagement and relevance data.</p></div></div><div class="discovery-grid">${rec.map(publicBookCard).join('')}</div></section>`:''}${groups.map(g=>`<section class="section"><div class="home-section-head"><h2>${esc(g.genre)}</h2></div><div class="discovery-grid">${g.books.map(publicBookCard).join('')}</div></section>`).join('')||(!rec.length?'<div class="card empty muted">No public books yet.</div>':'')}</div>`)}
async function filterDiscovery(){const q=document.getElementById('dq')?.value||'';const genre=document.getElementById('dg')?.value||'';try{const x=await api('/api/discover/books?q='+encodeURIComponent(q)+'&genre='+encodeURIComponent(genre));renderDiscovery(x)}catch(e){alert(e.message)}}
async function toggleLibrary(bookId,currently){try{await api('/api/library/'+bookId,{method:currently?'DELETE':'POST'});const x=await api('/api/library');state.libraryBooks=x.books||[];render()}catch(e){alert(e.message)}}
async function toggleFavorite(bookId,currently){try{const r=await api('/api/favorites/'+bookId,{method:currently?'DELETE':'POST'});const apply=b=>{if(b&&b.id===bookId){b.stats=r.stats;b.stats.favorited=!!r.favorited}};[...(state.data?.books||[]),...(state.data?.libraryBooks||[]),...(state.data?.continueReading||[]),...(state.data?.favorites||[])].forEach(apply);(state.libraryBooks||[]).forEach(apply);if(state.book?.id===bookId)apply(state.book);if(state.view==='discover')return discover();return render();}catch(e){alert(e.message)}}
async function loadLibraryBooks(){try{const x=await api('/api/library');state.libraryBooks=x.books||[]}catch(e){state.libraryBooks=[]}}
function shortDescription(text,max=35){const words=String(text||'').trim().split(/\s+/).filter(Boolean);return words.length>max?words.slice(0,max).join(' ')+'…':words.join(' ')}
function publicBookCard(b){const inLibrary=state.libraryBooks?.some(x=>x.id===b.id);const fav=!!b.stats?.favorited;const st=b.stats||{reads:0,libraryAdds:0,favorites:0};return '<div class="card book"><div class="book-cover" onclick="openBookDetail(\''+attr(b.id)+'\')">'+(b.cover?'<img src="'+attr(b.cover)+'" alt="'+attr(b.title)+' cover">':'<div class="book-cover-placeholder">'+esc(b.title)+'</div>')+'</div><div class="meta"><span class="pill">'+esc(b.genre||'Book')+'</span><span class="muted small">by <span class="link" onclick="openUser(\''+attr(b.author.id)+'\')">@'+esc(b.author.username)+'</span></span></div><h3 class="book-title-link" onclick="openBookDetail(\''+attr(b.id)+'\')">'+esc(b.title)+'</h3><p>'+esc(shortDescription(b.description,35))+'</p><div class="tags">'+(b.tags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join('')+'</div><p class="muted small book-stats">📖 '+st.reads+' Reads · 📚 '+st.libraryAdds+' Added to Library · ♥ '+st.favorites+' Favorites</p><div class="row"><button onclick="openBookDetail(\''+attr(b.id)+'\')">View Book</button><button class="secondary" onclick="toggleFavorite(\''+attr(b.id)+'\','+fav+')">'+(fav?'✓ Added to Favorites':'♡ Add to Favorites')+'</button>'+(b.author.id!==me?.id?'<button class="secondary" onclick="toggleLibrary(\''+attr(b.id)+'\','+inLibrary+')">'+(inLibrary?'✓ In Library':'＋ Add to Library')+'</button>':'')+'</div></div>'}
async function openBookDetail(id){try{const x=await api('/api/books/'+id);state.book=x.book;state.view='bookDetail';render()}catch(e){alert(e.message)}}
function bookDetailPage(){const b=state.book;if(!b)return '<div></div>';return app.innerHTML=shell('<div class="card"><button class="secondary back-btn" onclick="go(\'discover\')">← Discovery</button><div class="book-cover" style="max-width:260px;margin:10px auto 28px">'+(b.cover?'<img src="'+attr(b.cover)+'" alt="'+attr(b.title)+' cover" style="display:block;width:100%;height:auto;object-fit:contain">':'<div class="book-cover-placeholder">'+esc(b.title)+'</div>')+'</div><div class="meta"><span class="pill">'+esc(b.genre||'Book')+'</span><span class="muted small">by <span class="mention-link" onclick="openUser(\''+attr(b.author?.id||b.userId)+'\')">@'+esc(b.author?.username||'user')+'</span></span></div><h1>'+esc(b.title)+'</h1><section class="book-description-full">'+esc(b.description||'')+'</section><div class="tags">'+(b.tags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join('')+'</div><div class="row"><button onclick="readBook(\''+attr(b.id)+'\')">Read Book</button>'+(b.author?.id!==me?.id?'<button class="secondary" onclick="toggleLibrary(\''+attr(b.id)+'\','+!!state.libraryBooks?.some(x=>x.id===b.id)+')">'+(state.libraryBooks?.some(x=>x.id===b.id)?'✓ In Library':'＋ Add to Library')+'</button>':'')+'</div></div>')}
async function chika(){try{const x=await api('/api/chika');const items=(x.diaries||[]).map(publicDiaryCard);app.innerHTML=shell(`<section class="hero"><h1>💬 Chika</h1><p>Diary entries from people you're allowed to see based on their privacy settings and your relationship with them.</p><button onclick="newDiary()">📔 Write a Diary Entry</button></section><div class="chika-feed">${items.join('')||'<div class="card empty muted">No diaries are available to you right now.</div>'}</div>`)}catch(e){alert(e.message)}}
function publicDiaryCard(x){return `<div class="card public-diary-card"><div class="diary-meta"><span class="pill">${diaryVisibilityLabel(x.visibility)}</span><span class="muted small">${esc(x.date)} · ${new Date(x.createdAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span></div><h3>${esc(x.title)}</h3><p class="muted">by <span class="link" onclick="openUser('${x.author.id}')">@${esc(x.author.username)}</span></p><div class="diary-meta">${x.mood?`<span class="pill">💭 ${esc(x.mood)}</span>`:''}${x.weather?`<span class="pill">${esc(x.weather)}</span>`:''}${x.season?`<span class="pill">🍃 ${esc(x.season)}</span>`:''}</div>${x.imageUrl?`<img class="diary-photo" src="${attr(x.imageUrl)}" alt="Diary photo">`:''}<p class="diary-body">${esc(x.content.slice(0,220))}${x.content.length>220?'…':''}</p><p class="muted small">${x.commentCount||0} comment(s)</p><div class="post-actions"><button onclick="toggleDiaryLike('${x.id}',${!!x.liked})">${x.liked?'♥ Liked':'♡ Like'} · ${x.likesCount||0}</button><button class="secondary" onclick="openDiary('${x.id}')">Read Diary</button></div></div>`}
async function library(){const d=state.data;app.innerHTML=shell(`<section class="hero"><h1>📚 My Books</h1><p>Your books and their chapters. Every page can have its own title — exactly as you type it.</p><button onclick="newBook()">＋ Create Book</button></section><div class="book-management-grid">${d.books.map(b=>`<div class="card"><div class="book-cover">${b.cover?`<img src="${attr(b.cover)}" alt="${attr(b.title)} cover">`:`<div class="book-cover-placeholder">${esc(b.title)}</div>`}</div><div class="meta"><span class="pill">${b.visibility==='public'?'🌎 Public':'🔒 Only Me'}</span><span class="pill">${esc(b.genre||'No genre')}</span></div><h3>${esc(b.title)}</h3><p>${esc(b.description||'')}</p><div class="tags">${(b.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><p class="muted small">${b.chapters.length} page(s)</p><p class="muted small book-stats">📖 ${b.stats?.reads||0} Reads · 📚 ${b.stats?.libraryAdds||0} Added to Library · ♥ ${b.stats?.favorites||0} Favorites</p><button onclick="readBook('${b.id}')">Read</button> <button class="secondary" onclick="editBook('${b.id}')">Edit</button> <button class="danger" onclick="moveToTrash('books','${b.id}')">Delete</button></div>`).join('')||'<div class="card empty muted">Create your first book.</div>'}</div>`)}
async function readBook(id){try{const x=await api('/api/books/'+id);state.book=x.book;const resume=state.data?.continueReading?.find(b=>b.id===id);const chapterId=resume?.chapterId||x.book.chapters?.[0]?.id;if(!chapterId)return;await openChapter(id,chapterId)}catch(e){alert(e.message)}}
function getReaderAnchor(){const root=document.getElementById('readerText');if(!root)return null;const y=Math.min(Math.max(120,Math.round(window.innerHeight*.35)),Math.max(120,window.innerHeight-20));let pos=null;try{if(document.caretPositionFromPoint)pos=document.caretPositionFromPoint(Math.round(window.innerWidth/2),y);else if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(Math.round(window.innerWidth/2),y);if(r)pos={offsetNode:r.startContainer,offset:r.startOffset}}}catch(e){}if(!pos?.offsetNode||!root.contains(pos.offsetNode))return null;let offset=0;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while((node=walker.nextNode())){if(node===pos.offsetNode)return {offset:offset+Math.min(Number(pos.offset)||0,node.nodeValue?.length||0),viewportY:y};offset+=node.nodeValue?.length||0}return null}
function restoreReaderAnchor(anchorOffset,anchorViewportY){const root=document.getElementById('readerText');const target=Number(anchorOffset);const viewportY=Math.max(40,Math.min(Number(anchorViewportY)||120,window.innerHeight-20));if(!root||!Number.isFinite(target)||target<0)return false;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node,offset=0;while((node=walker.nextNode())){const len=node.nodeValue?.length||0;if(target<=offset+len){try{const range=document.createRange();range.setStart(node,Math.min(Math.max(0,target-offset),len));range.collapse(true);const rect=range.getBoundingClientRect();if(Number.isFinite(rect.top)){window.scrollTo({top:Math.max(0,window.scrollY+rect.top-viewportY),behavior:'auto'});return true}}catch(e){}return false}offset+=len}return false}
async function saveReaderPosition(){if(state.view!=='reader'||!state.book?.id||!state.chapter?.id)return;const scrollTop=Math.max(0,Math.round(window.scrollY||document.documentElement.scrollTop||0));const anchor=getReaderAnchor();if(Math.abs(scrollTop-lastReaderScroll)<2&&!anchor)return;lastReaderScroll=scrollTop;try{await api('/api/reading-progress/'+state.book.id,{method:'PUT',keepalive:true,timeoutMs:3000,body:JSON.stringify({chapterId:state.chapter.id,scrollTop,anchorOffset:anchor?.offset??null,anchorViewportY:anchor?.viewportY??null})})}catch(e){}}function queueReaderProgress(){if(state.view!=='reader')return;clearTimeout(readerSaveTimer);readerSaveTimer=setTimeout(saveReaderPosition,500)}window.addEventListener('scroll',queueReaderProgress,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveReaderPosition()});async function openChapter(bookId,chapterId){try{await saveReaderPosition();const x=await api('/api/books/'+bookId+'/chapters/'+chapterId);state.book=x.book;state.chapter=x.chapter;state.chapterData=x;state.highlightVisible=false;state.view='reader';lastReaderScroll=Math.max(0,Number(x.scrollTop||0));try{localStorage.setItem('lumora-reader-location',JSON.stringify({bookId,chapterId}));localStorage.setItem('lumora-last-section','reader')}catch(e){}render();requestAnimationFrame(()=>{if(!restoreReaderAnchor(x.anchorOffset,x.anchorViewportY))window.scrollTo({top:lastReaderScroll,behavior:'auto'});requestAnimationFrame(()=>{if(Number.isFinite(Number(x.anchorOffset)))restoreReaderAnchor(x.anchorOffset,x.anchorViewportY)})})}catch(e){alert(e.message)}}
function highlightMarkup(text,highlights){let clean=String(text||'');const hs=(highlights||[]).filter(h=>Number.isFinite(h.start)&&Number.isFinite(h.end)&&h.start>=0&&h.end>h.start).sort((a,b)=>a.start-b.start);let out='',cursor=0;for(const h of hs){if(h.start<cursor)continue;out+=esc(clean.slice(cursor,h.start));out+=`<mark title="${attr(h.note||'Highlight')}">${esc(clean.slice(h.start,h.end))}</mark>`;cursor=h.end}out+=esc(clean.slice(cursor));return out}
function richStoryMarkup(c,highlights,showHighlights){const html=c.contentHtml||'';if(!showHighlights)return html||esc(c.content||'');if(!html)return highlightMarkup(c.content,highlights);const box=document.createElement('div');box.innerHTML=html;const hs=(highlights||[]).filter(h=>Number.isFinite(h.start)&&Number.isFinite(h.end)&&h.start>=0&&h.end>h.start).sort((a,b)=>a.start-b.start);if(!hs.length)return html;const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);let offset=0;for(const node of nodes){const text=node.nodeValue||'',start=offset,end=offset+text.length,ranges=hs.filter(x=>x.end>start&&x.start<end);if(ranges.length){let frag=document.createDocumentFragment(),cursor=0;for(const r of ranges){const a=Math.max(0,r.start-start),z=Math.min(text.length,r.end-start);if(a>cursor)frag.appendChild(document.createTextNode(text.slice(cursor,a)));const mark=document.createElement('mark');mark.title=r.note||'Highlight';mark.textContent=text.slice(a,z);frag.appendChild(mark);cursor=z}if(cursor<text.length)frag.appendChild(document.createTextNode(text.slice(cursor)));node.parentNode.replaceChild(frag,node)}offset=end}return box.innerHTML}
function reader(){const b=state.book,c=state.chapter,x=state.chapterData||{comments:[],highlights:[],bookmark:null};const i=b.chapters.findIndex(z=>z.id===c.id),prev=b.chapters[i-1],next=b.chapters[i+1];const visible=!!state.highlightVisible;const rf=localStorage.getItem('lumora-reader-font')||'Roboto';app.innerHTML=shell(`<div class="reader story-reader" data-story-font="${attr(rf)}"><div class="reader-header"><div class="meta"><span class="pill">${esc(b.genre||'Book')}</span>${(b.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><h1>${esc(c.title||'Untitled Page')}</h1><p class="muted">${esc(b.title)} · Page ${i+1} of ${b.chapters.length} · ${c.readCount||0} reads</p></div><div class="chapter-list card"><b>Chapters</b>${b.chapters.map(ch=>`<button class="${ch.id===c.id?'active':''}" onclick="openChapter('${b.id}','${ch.id}')">${esc(ch.title||'Untitled Page')} <span class="muted small">· ${ch.readCount||0} reads</span></button>`).join('')}</div><div class="reader-layout"><aside class="reader-actions"><button class="secondary back-btn" onclick="library()">← My Books</button><button onclick="highlightSelection()">🖍 Highlight selected text</button><button class="secondary" onclick="toggleHighlights()">✨ ${visible?'Hide Highlights':'Highlights'}</button><button class="secondary" onclick="bookmarkChapter()">${x.bookmark?'🔖 Remove Bookmark':'🔖 Bookmark page'}</button><button class="secondary" onclick="toggleFavorite('${b.id}',${!!b.stats?.favorited})">${b.stats?.favorited?'♥ Remove from Favorites':'♡ Add to Favorites'}</button><div class="reader-font-control"><label class="small muted">Reader font</label><select onchange="setReaderFont(this.value)"><option ${rf==='Roboto'?'selected':''}>Roboto</option><option ${rf==='Sans Serif'?'selected':''}>Sans Serif</option><option ${rf==='DM Pro'?'selected':''}>DM Pro</option><option ${rf==='Arial'?'selected':''}>Arial</option><option ${rf==='Calibri'?'selected':''}>Calibri</option></select></div><div class="book-stats reader-stats">📖 ${b.stats?.reads||0} Reads<br>📚 ${b.stats?.libraryAdds||0} Added to Library<br>♥ ${b.stats?.favorites||0} Favorites</div><button class="secondary" onclick="focusComment()">💬 Comment</button></aside><main class="reader-main"><article class="reader-paper"><div id="readerText" class="reader-content">${richStoryMarkup(c,x.highlights,visible)}</div></article><div class="chapter-nav">${prev?`<button class="secondary" onclick="openChapter('${b.id}','${prev.id}')">← ${esc(prev.title||'Previous')} · ${prev.readCount||0} reads</button>`:'<span></span>'}${next?`<button class="secondary" onclick="openChapter('${b.id}','${next.id}')">${esc(next.title||'Next')} · ${next.readCount||0} reads →</button>`:'<span></span>'}</div>${visible?`<div class="card highlights-panel"><div class="home-section-head"><div><h3>✨ Your Highlights</h3><p class="muted small">Private notes saved to this chapter.</p></div></div>${x.highlights.length?x.highlights.map(h=>`<div class="comment"><b>“${esc(h.text)}”</b>${h.note?`<p>${esc(h.note)}</p>`:''}<button class="secondary small" onclick="deleteHighlight('${h.id}')">Remove</button></div>`).join(''):'<p class="muted">No highlights yet.</p>'}</div>`:''}<div id="chapterComments" class="card section"><h3>Comments</h3>${commentsHTML(x.comments||[])}<div class="field"><textarea id="chapterComment" placeholder="Leave a comment about this page..."></textarea></div><button onclick="addComment('chapter','${c.id}','chapterComment')">Comment</button></div></main></div></div>`) }
function setReaderFont(font){const allowed=['Roboto','Sans Serif','DM Pro','Arial','Calibri'];if(!allowed.includes(font))return;localStorage.setItem('lumora-reader-font',font);const root=document.querySelector('.story-reader');if(root)root.setAttribute('data-story-font',font)}
function selectionOffsets(){const sel=window.getSelection();const root=document.getElementById('readerText');if(!sel||sel.rangeCount===0||!root||sel.isCollapsed)return null;const range=sel.getRangeAt(0);if(!root.contains(range.startContainer)||!root.contains(range.endContainer))return null;const before=range.cloneRange();before.selectNodeContents(root);before.setEnd(range.startContainer,range.startOffset);const start=before.toString().length;const selected=range.toString();return {start,end:start+selected.length,text:selected};}
async function highlightSelection(){const off=selectionOffsets();if(!off||!off.text.trim())return alert('Select a word or portion of the story first.');const note=prompt('Optional note for this highlight:')||'';try{await api('/api/highlights',{method:'POST',body:JSON.stringify({chapterId:state.chapter.id,text:off.text,start:off.start,end:off.end,note})});window.getSelection()?.removeAllRanges();await openChapter(state.book.id,state.chapter.id)}catch(e){alert(e.message)}}

async function toggleDiaryLike(id,liked){try{await api('/api/likes/diary/'+id,{method:liked?'DELETE':'POST'});await chika()}catch(e){alert(e.message)}}async function togglePostLike(id,liked,returnView='news'){try{const r=await api('/api/likes/post/'+id,{method:liked?'DELETE':'POST'});const update=p=>{if(p?.id===id){p.liked=!!r.liked;p.likesCount=Number(r.likesCount||0)}};if(state.data?.posts)state.data.posts.forEach(update);if(state.data?.archivedPosts)state.data.archivedPosts.forEach(update);if(state.profile?.posts)state.profile.posts.forEach(update);if(state.postData?.post?.id===id)update(state.postData.post);return render();}catch(e){alert(e.message)}}async function toggleRepost(id,returnView='news',currently=false){try{const exists=currently||state.data?.reposts?.some(r=>r.post?.id===id);const r=await api('/api/reposts/'+id,{method:exists?'DELETE':'POST'});const update=p=>{if(p?.id===id)p.reposted=!!r.reposted};if(state.data?.posts)state.data.posts.forEach(update);if(state.profile?.posts)state.profile.posts.forEach(update);if(state.postData?.post?.id===id)update(state.postData.post);if(state.data&&Array.isArray(state.data.reposts)){if(exists)state.data.reposts=state.data.reposts.filter(x=>x.post?.id!==id);else if(r.repost)state.data.reposts.unshift(r.repost)}return render();}catch(e){alert(e.message)}}function postPage(){const x=state.postData;if(!x)return;app.innerHTML=shell(`<div class="card"><button class="secondary back-btn" onclick="go('news')">← News Feed</button><div class="post-detail-meta"><span class="pill">${visibilityLabel(x.post.visibility)}</span><span class="muted">${new Date(x.post.createdAt).toLocaleString()}</span></div><p class="muted book-detail-author">Posted by <span class="mention-link" onclick="openUser('${x.post.author?.id||x.post.userId}')">@${esc(x.post.author?.username||'user')}</span></p><p class="post-body">${esc(x.post.content)}</p>${x.post.userId===me.id?`<button class="secondary" onclick="editPost('${x.post.id}')">Edit</button>`:''}<div class="post-actions"><button onclick="togglePostLike('${x.post.id}',${!!x.post.liked},'post')">${x.post.liked?'♥ Liked':'♡ Like'} · ${x.post.likesCount||0}</button>${x.post.visibility==='public'?`<button class="secondary" onclick="toggleRepost('${x.post.id}','post',${!!x.post.reposted})">${x.post.reposted?'✓ Reposted':'↻ Repost'}</button>`:''}</div><hr><h3>Comments</h3>${commentsHTML(x.comments||[])}<div class="field"><textarea id="postComment" placeholder="Write a comment..."></textarea></div><button onclick="addComment('post','${x.post.id}','postComment')">Comment</button></div>`)}
async function openPost(id){try{state.postData=await api('/api/posts/'+id);state.view='post';render()}catch(e){alert(e.message)}}

function searchPage(){const x=state.search||{q:'',books:[],people:[],diaries:[],posts:[]};return app.innerHTML=shell(`<section class="hero"><h1>Search</h1><p>Results for <b>“${esc(x.q)}”</b>. Only public content is included.</p></section>${resultSection('Books',x.books.map(publicBookCard).join(''),'No public books found.')} ${resultSection('People',x.people.map(u=>`<div class="card"><div class="row">${avatarMarkup(u)}<div><h3>${esc(u.name||u.username)}</h3><p class="muted">@${esc(u.username)}</p></div></div><p>${esc(u.bio||'')}</p><button onclick="openUser('${u.id}')">View Profile</button></div>`).join(''),'No people found.')} ${resultSection('Public Diaries',x.diaries.map(publicDiaryCard).join(''),'No public diaries found.')} ${resultSection('Public Posts',x.posts.map(p=>`<div class="card"><div class="meta"><span class="pill">✍️ Public Post</span><span class="muted">by @${esc(p.author.username)}</span></div><p class="post-body">${esc(p.content)}</p><button onclick="openPost('${p.id}')">Open</button></div>`).join(''),'No public posts found.')}`)}

  const cover=u.coverUrl?'<div class="profile-cover" style="background-image:url(\''+attr(u.coverUrl)+'\')"><button class="profile-cover-clickable" aria-label="View cover photo" onclick="openImageLightbox(\''+attr(u.coverUrl)+'\');event.stopPropagation()"></button>': '<div class="profile-cover">';

}


function profileTabs(active,publicMode){
  const items=[['books','📚','Books'],['diary','📔','Diary'],['thoughts','💭','Thoughts'],['reposts','🔁','Reposts']];
  const fn=publicMode?'selectPublicProfileTab':'selectProfileTab';
  return '<nav class="profile-tabs" role="tablist" aria-label="Profile content tabs">'+items.map((x,i)=>'<span class="profile-tab-item"><button type="button" class="profile-tab '+(active===x[0]?'active':'')+'" role="tab" aria-selected="'+(active===x[0])+'" aria-label="'+x[2]+'" onclick="'+fn+"('"+x[0]+"')"+'"><span class="profile-tab-icon">'+x[1]+'</span></button>'+(i<items.length-1?'<span class="profile-tab-divider" aria-hidden="true">|</span>':'')+'</span>').join('')+'</nav>';
}

function publicTabMarkup(tab,x){

count.</p></div></div>${archived.map(p=>`<div class="archive-item"><div class="meta"><span class="pill">🗂 Archived Thought</span><span class="muted small">${new Date(p.createdAt).toLocaleString()}</span></div><p class="post-body">${esc(p.content)}</p><button class="secondary" onclick="openPost('${p.id}')">Open Thought</button></div>`).join('')||'<div class="empty muted">Your Archive Thoughts are empty for now.</div>'}</div></section>`);}

function newBook(existing){const b=existing||{title:'',description:'',genre:'',tags:[],visibility:'private',fontFamily:'Roboto',chapters:[{id:crypto.randomUUID(),title:'',content:'',contentHtml:''}]};const m=modal(`<h2>${existing?'Edit':'Create'} Book</h2><p class="muted">Type each page title exactly how you want it to appear. Formatting and font choices apply only to this Story Book.</p><div class="field"><label>Book Title</label><input id="bt" value="${attr(b.title)}"></div><div class="field"><label>Book Cover <span class="muted small">(optional)</span></label><input id="bookCoverFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewBookCover(this)"><div id="bookCoverPreview">${b.cover?`<img class="upload-preview" src="${attr(b.cover)}" alt="Book cover preview">`:''}</div><p class="upload-hint">Upload a cover image for your book. A portrait image works best.</p><input id="bc" value="${attr(b.cover||'')}" placeholder="Or paste a cover image URL (optional)"></div><div class="field"><label>Description</label><textarea id="bd">${esc(b.description)}</textarea></div><div class="field"><label>Genre</label><select id="bg"><option value="">Choose a genre</option>${GENRES.map(g=>`<option ${b.genre===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div><div class="field"><label>Tags</label><input id="btag" value="${attr((b.tags||[]).join(', '))}" placeholder="slowburn, fantasy, enemies-to-lovers"><p class="small muted">Separate tags with commas. # is optional.</p></div><div class="field"><label>Visibility</label><select id="bv"><option value="private" ${b.visibility==='private'?'selected':''}>Only Me</option><option value="public" ${b.visibility==='public'?'selected':''}>Public</option></select></div><div class="field"><label>Story Font</label><select id="bf">${['Roboto','Sans-serif','Arial','Calibri','Source Sans Pro','DM Pro'].map(f=>`<option value="${attr(f)}" ${storyFontCss(b.fontFamily)===storyFontCss(f)?'selected':''}>${f}</option>`).join('')}</select><p class="story-font-preview">This changes the font of this Story Book only.</p></div><h3>Pages / Chapters</h3><div id="chapters">${b.chapters.map((c,i)=>chapterHTML(c,i)).join('')}</div><button class="secondary" onclick="addChapter()">＋ Add Page / Chapter</button><br><br><button onclick="saveBook('${existing?.id||''}')">Save Book</button> <button class="danger" onclick="cancelComposer(this)">Cancel</button>` ,true);window.currentModal=m;window.currentBook=b} 
function chapterHTML(c,i){const html=c.contentHtml||esc(c.content||'');return `<div class="chapter-editor" draggable="true" data-chapter-id="${attr(c.id||'')}"><div class="row"><span class="drag-handle">☷</span><b class="page-number">Page ${i+1}</b><span class="muted small">(ordering only)</span><button type="button" class="secondary small" onclick="moveChapter(this,-1)">↑</button><button type="button" class="secondary small" onclick="moveChapter(this,1)">↓</button></div><div class="field"><label>Page / Chapter Title</label><input class="ct" placeholder="e.g. CHAPTER 1 — THE BEGINNING, Prologue, The Night We Met" value="${attr(c.title)}"></div><div class="field"><label>Story Text</label><div class="story-format-toolbar"><button type="button" class="secondary" onclick="formatStory('bold',this)"><b>B</b></button><button type="button" class="secondary" onclick="formatStory('italic',this)"><i>I</i></button><button type="button" class="secondary" onclick="formatStory('underline',this)"><u>U</u></button><button type="button" class="secondary" onclick="formatStory('removeFormat',this)">Normal</button></div><div class="story-editor" contenteditable="true">${html}</div></div></div>`}

function addChapter(){const box=currentModal.querySelector('#chapters');box.insertAdjacentHTML('beforeend',chapterHTML({title:'',content:''},box.children.length));updateChapterNumbers()}
function moveChapter(btn,dir){const box=currentModal.querySelector('#chapters');const item=btn.closest('.chapter-editor');if(dir<0&&item.previousElementSibling)box.insertBefore(item,item.previousElementSibling);if(dir>0&&item.nextElementSibling)box.insertBefore(item.nextElementSibling,item);updateChapterNumbers()}

async function saveBook(id){const chapters=[...currentModal.querySelectorAll('.chapter-editor')].map(x=>{const editor=x.querySelector('.story-editor');return {id:x.dataset.chapterId||crypto.randomUUID(),title:x.querySelector('.ct').value,content:storyEditorText(editor),contentHtml:editor?.innerHTML||''}});const tags=(document.getElementById('btag').value||'').split(',').map(x=>x.trim()).filter(Boolean);let cover=document.getElementById('bc')?.value.trim()||'';const f=document.getElementById('bookCoverFile')?.files?.[0];if(f)cover=await resizeImage(f,800,.62);const payload={title:bt.value,description:bd.value,genre:bg.value,tags,visibility:bv.value,cover,chapters,fontFamily:document.getElementById('bf').value};try{if(id)await api('/api/books/'+id,{method:'PUT',body:JSON.stringify(payload)});else await api('/api/books',{method:'POST',body:JSON.stringify(payload)});currentModal.remove();await dashboard()}catch(e){alert(e.message)}}

function editBook(id){const b=state.data.books.find(x=>x.id===id);newBook(b)}
function newDiary(existing){const x=existing||{title:'',mood:'',weather:'',season:'',content:'',visibility:'private',date:new Date().toISOString().slice(0,10)};const m=modal(`<h2>${existing?'Edit':'New'} Diary Entry</h2><p class="muted">Capture the little details of the day too.</p><div class="field"><label>Title</label><input id="dt" value="${attr(x.title)}"></div><div class="field"><label>Date</label><input id="dd" type="date" value="${attr(x.date)}"></div><div class="field"><label>Mood <span class="muted small">(optional)</span></label><input id="dm" value="${attr(x.mood)}" placeholder="e.g. Calm, Nostalgic, Loved"></div><div class="field"><label>Weather <span class="muted small">(optional)</span></label><select id="dw"><option value="">Choose weather</option>${WEATHER.map(w=>`<option value="${attr(w[0]+' '+w[1])}" ${x.weather===w[0]+' '+w[1]?'selected':''}>${w[0]} ${w[1]}</option>`).join('')}</select></div><div class="field"><label>Season <span class="muted small">(optional)</span></label><select id="ds"><option value="">Choose season</option>${SEASONS.map(s=>`<option ${x.season===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Photo <span class="muted small">(optional)</span></label><input id="diaryPhotoFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewDiaryPhoto(this)"><div id="diaryPhotoPreview">${x.imageUrl?`<img class="upload-preview" style="max-width:260px;max-height:220px;object-fit:contain" src="${attr(x.imageUrl)}" alt="Diary photo preview">`:''}</div><input id="dip" value="${attr(x.imageUrl||'')}" placeholder="Or paste a photo URL (optional)"></div><div class="field"><label>Entry</label><textarea id="dc">${esc(x.content)}</textarea></div><div class="field"><label>Who can see this?</label><select id="dv">${visibilityOptions(x.visibility)}</select></div><button onclick="saveDiary('${existing?.id||''}')">Save Entry</button> <button class="secondary" onclick="cancelComposer(this)">Cancel</button>`,true);window.currentDiary=x}
async function saveDiary(id){try{const returnToChika=state.view==='chika';let imageUrl=document.getElementById('dip')?.value.trim()||'';const f=document.getElementById('diaryPhotoFile')?.files?.[0];if(f)imageUrl=await resizeImage(f,1000,.62);const payload={title:dt.value,date:dd.value,mood:dm.value,weather:dw.value,season:ds.value,imageUrl,content:dc.value,visibility:dv.value};if(id)await api('/api/diaries/'+id,{method:'PUT',body:JSON.stringify(payload)});else await api('/api/diaries',{method:'POST',body:JSON.stringify(payload)});document.querySelector('.modal').remove();await dashboard();if(returnToChika){state.view='chika';await render()}}catch(e){alert(e.message)}}
function editDiary(id){const x=state.data.diaries.find(x=>x.id===id);newDiary(x)}
function newPost(existing){const p=existing||{content:'',visibility:'public'};const m=modal(`<h2>${existing?'Edit':'Share a Thought'}</h2><p class="muted">Public thoughts live in News Feed for 24 hours before moving to your Archive.</p><div class="field"><label>Your thought</label><textarea id="pc" placeholder="What are you thinking?">${esc(p.content)}</textarea></div><div class="field"><label>Who can see this?</label><select id="pv">${visibilityOptions(p.visibility)}</select></div><button onclick="savePost('${existing?.id||''}')">Save Thought</button> <button class="secondary" onclick="cancelComposer(this)">Cancel</button>`,true);window.currentPost=p}
async function savePost(id){try{const returnToNews=state.view==='news';const payload={content:pc.value,visibility:pv.value};if(id)await api('/api/posts/'+id,{method:'PUT',body:JSON.stringify(payload)});else await api('/api/posts',{method:'POST',body:JSON.stringify(payload)});document.querySelector('.modal').remove();await dashboard();if(returnToNews){state.view='news';await render()}}catch(e){alert(e.message)}}
function editPost(id){const p=state.data.posts.find(x=>x.id===id);newPost(p)}
function esc(s=''){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function attr(s=''){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/'/g,'&#39;')}
start().catch(e=>{console.error(e);auth()});
</script>
