async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const j=await r.json();if(!r.ok){const e=Error(j.error||'Request failed');e.code=j.code;throw e}return j}
function applyTheme(){const key=(me&&me.theme)||localStorage.getItem('lumora-theme')||'Rose';const t=THEMES.find(x=>x[0]===key)||THEMES[0];document.documentElement.dataset.theme=key;document.documentElement.style.setProperty('--accent',t[1]);document.documentElement.style.setProperty('--accent2',t[2]);document.documentElement.style.setProperty('--accent3',t[3]);document.documentElement.style.setProperty('--soft',t[2]);}
applyTheme();

async function setTheme(name){
  const t=THEMES.find(x=>x[0]===name);
  if(!t)return;
  localStorage.setItem('lumora-theme',name);
  if(me){
    try{const r=await api('/api/profile',{method:'PUT',body:JSON.stringify({name:me.name,bio:me.bio||'',avatarUrl:me.avatarUrl||'',coverUrl:me.coverUrl||'',favoriteQuote:me.favoriteQuote||'',accountPrivacy:me.accountPrivacy||'public',messagePermission:me.messagePermission||'everyone',theme:name})});me=r.user;}catch(e){alert(e.message);return}
  }
  applyTheme();
  render();
}
function resizeImage(file,maxSize=1200,quality=.72){
  return new Promise((resolve,reject)=>{
    if(!file) return resolve('');
    if(!/^image\/(png|jpe?g|webp)$/i.test(file.type||'')) return reject(new Error('Please choose a PNG, JPG, or WEBP image.'));
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale));
        const h=Math.max(1,Math.round(img.naturalHeight*scale));
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>reject(new Error('Could not read that image.'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('Could not read that image.'));
    reader.readAsDataURL(file);
  });
}

}

function editProfile(){
  const u=me||{};
  const m=modal(`<button class="profile-close" aria-label="Close" onclick="closeProfileModal()">×</button><h2>✦ Edit Your Profile</h2><p class="muted">Make your little corner of Lumora feel like yours.</p>
  <div class="field"><label>Display Name</label><input id="pfName" value="${attr(u.name||'')}"></div>

  <div class="field"><label>Cover Image</label><input id="pfCoverFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewCover(this)"><div id="profileCoverPreview">${u.coverUrl?`<img class="upload-preview" style="max-width:420px;width:100%;height:150px;object-fit:contain" src="${attr(u.coverUrl)}" alt="Cover preview">`:''}</div><input id="pfCover" value="${attr(u.coverUrl||'')}" placeholder="Or paste a cover image URL"></div>

function profileFormSnapshot(){const ids=['pfName','pfAvatar','pfCover','pfBio','pfQuote','pfPrivacy','pfMessages'];return ids.map(id=>document.getElementById(id)?.value||'').join('\u0001');}

function loginForm(){document.getElementById('authbox').innerHTML=`<h2>Welcome back</h2><div class="field"><label>Email or username</label><input id="u" autocomplete="username"></div><div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div><button onclick="login()">Log in</button><div style="display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;text-align:center"><a href="#" style="color:var(--accent);font-weight:700;text-decoration:underline" onclick="forgotPasswordForm();return false">Forgot Password?</a><span class="muted">|</span><span class="muted">New here?</span><a href="#" style="color:var(--accent);font-weight:600;text-decoration:underline" onclick="signupForm();return false">Create an account</a></div>`}

function forgotPasswordForm(){document.getElementById('authbox').innerHTML=`<h2>Forgot your password?</h2><p class="muted">Enter your email or username. We will send a 6-digit password reset code.</p><div class="field"><label>Email or username</label><input id="forgotIdentifier" autocomplete="username email"></div><button onclick="requestPasswordReset()">Send reset code</button><p class="small"><a href="#" onclick="loginForm();return false">Back to log in</a></p>`}

async function requestPasswordReset(){try{const identifier=String(document.getElementById('forgotIdentifier')?.value||'').trim();if(!identifier)return alert('Please enter your email or username.');window.resetIdentifier=identifier;const x=await api('/api/forgot-password',{method:'POST',body:JSON.stringify({identifier})});resetPasswordCodeForm(x.previewCode)}catch(e){alert(e.message)}}

function resetPasswordCodeForm(previewCode=''){document.getElementById('authbox').innerHTML=`<h2>Enter reset code</h2><p class="muted">Enter the 6-digit code sent to your email, then choose a new password.</p><div class="field"><label for="resetCode">Password reset code</label><input id="resetCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,6)" onkeydown="if(event.key==='Enter')verifyResetCode()"></div><button onclick="verifyResetCode()">Verify Code</button><p class="small"><a href="#" onclick="forgotPasswordForm();return false">Use a different email/username</a></p>${previewCode?`<p class="small"><b>Local development preview code:</b> ${esc(previewCode)}</p>`:''}`}

async function verifyResetCode(){try{const code=String(document.getElementById('resetCode')?.value||'').replace(/\\D/g,'');if(code.length!==6)return alert('Please enter the 6-digit password reset code.');window.resetCode=code;await api('/api/verify-password-reset-code',{method:'POST',body:JSON.stringify({identifier:window.resetIdentifier,code})});newPasswordForm()}catch(e){alert(e.message)}}

function newPasswordForm(){document.getElementById('authbox').innerHTML=`<h2>Create a new password</h2><p class="muted">Your reset code is verified. Choose a new password for your Lumora account.</p><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" onkeydown="if(event.key==='Enter')finishPasswordReset()"></div><button onclick="finishPasswordReset()">Reset Password</button><p class="small"><a href="#" onclick="loginForm();return false">Back to log in</a></p>`}

async function finishPasswordReset(){try{const password=document.getElementById('newPassword')?.value||'';const confirm=document.getElementById('confirmPassword')?.value||'';if(password.length<8)return alert('Password must be at least 8 characters.');if(password!==confirm)return alert('Passwords do not match.');await api('/api/reset-password',{method:'POST',body:JSON.stringify({identifier:window.resetIdentifier,code:window.resetCode,password})});window.resetIdentifier=null;window.resetCode=null;alert('Your password has been reset. You can now log in with your new password.');loginForm()}catch(e){alert(e.message)}}

function signupForm(){document.getElementById('authbox').innerHTML=`<h2>Create your account</h2><div class="field"><label>Name</label><input id="n"></div><div class="field"><label>Email</label><input id="e" type="email" autocomplete="email"></div><div class="field"><label>Username</label><input id="u" autocomplete="username"></div><div class="field"><label>Password (8+ characters)</label><input id="p" type="password" autocomplete="new-password"></div><button onclick="signup()">Sign up</button><p class="small">Already have an account? <a href="#" onclick="loginForm();return false">Log in</a></p>`}

async function login(){try{const x=await api('/api/login',{method:'POST',body:JSON.stringify({identifier:u.value,password:p.value})});me=x.user;applyTheme();await dashboard()}catch(e){alert(e.message)}}

async function signup(){try{const x=await api('/api/signup',{method:'POST',body:JSON.stringify({name:n.value,email:e.value,username:u.value,password:p.value})});me=x.user;verificationPage(x.previewCode)}catch(e){alert(e.message)}}

function verificationPage(preview){app.innerHTML=`<div class="app"><div class="auth card"><h1>✉ Verify your email</h1><p>We sent a <b>6-digit verification code</b> to <b>${esc(me.email||'your email')}</b>.</p><div class="verify"><p>Enter the code from your email below to verify your account.</p><div class="field"><label for="verificationCode">Verification Code</label><input id="verificationCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,6)" onkeydown="if(event.key==='Enter')verifyEmailCode()"></div><button onclick="verifyEmailCode()">Verify Code</button><p class="small" style="margin-top:12px">Code expired or not received? <a href="#" onclick="resendVerification();return false">Send me a new code</a></p>${preview?`<p class="small"><b>Local development preview code:</b> ${esc(preview)}</p>`:''}</div><br><button class="secondary" onclick="logout()">Log out</button></div></div>`}

async function verifyEmailCode(){try{const x=document.getElementById('verificationCode');const code=String(x?.value||'').replace(/\D/g,'');if(code.length!==6)return alert('Please enter the 6-digit verification code.');const r=await api('/api/verify-email-code',{method:'POST',body:JSON.stringify({code})});me=r.user;applyTheme();await dashboard()}catch(e){alert(e.message)}}

async function resendVerification(){try{const x=await api('/api/resend-verification',{method:'POST'});if(x.previewCode)verificationPage(x.previewCode);else alert('Verification email sent.')}catch(e){alert(e.message)}}
async function logout(){await api('/api/logout',{method:'POST'});me=null;auth()}
async function refreshNotificationCount(){try{const x=await api('/api/notifications');state.notificationCount=x.unread||0;const btn=document.querySelector('.notification-btn');if(btn){let badge=btn.querySelector('.notification-badge');if(state.notificationCount&&!badge){badge=document.createElement('span');badge.className='notification-badge';btn.appendChild(badge)}if(badge){badge.textContent=state.notificationCount>99?'99+':String(state.notificationCount);badge.style.display=state.notificationCount?'block':'none'}}}catch(e){state.notificationCount=0}}
async function dashboard(){const x=await api('/api/dashboard');state.data=x;state.view='home';await Promise.all([refreshNotificationCount(),loadLibraryBooks()]);render()}
setInterval(()=>{if(me&&me.emailVerified)refreshNotificationCount()},20000);
function go(v){state.view=v;render()}
async function render(){if(!me)return auth();if(state.view==='home')return home();if(state.view==='news')return news();if(state.view==='discover')return discover();if(state.view==='chika')return chika();if(state.view==='library')return library();if(state.view==='profile')return profile();if(state.view==='reader')return reader();if(state.view==='post')return postPage();if(state.view==='diary')return diaryPage();if(state.view==='search')return searchPage();if(state.view==='user')return userPage();if(state.view==='settings')return settingsPage();if(state.view==='social')return socialPage();if(state.view==='message')return messagePage();return home()}
async function home(){const d=state.data||{books:[],diaries:[],posts:[],continueReading:[],libraryBooks:[]};const recentDiary=[...(d.diaries||[])].sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt))[0];const recentPost=[...(d.posts||[])].sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt))[0];const continueBooks=d.continueReading||[];const libraryBooks=d.libraryBooks||[];app.innerHTML=shell(`<section class="hero"><div class="hero-copy"><div class="hero-kicker">Your creative space</div><h1>A place for every<br>story you carry.✨</h1><p>Write a book, keep a diary, share a thought, or disappear into someone else's story.<br>Lumora brings writing, reading, and memories together.</p><div class="top-actions home-actions"><button onclick="newBook()">📖 Write a Book</button><button class="secondary" onclick="newDiary()">📔 Open Diary</button><button class="secondary" onclick="newPost()">💌 Share a Thought</button></div></div></section><section class="home-section"><div class="home-section-head"><div><h2>Continue Reading</h2><p class="muted">Return to stories you've actually started.</p></div><button class="ghost" onclick="go('library')">View all books →</button></div><div class="continue-grid">${continueBooks.map(b=>`<div class="card home-book"><div class="book-cover small-book-cover">${b.cover?`<img src="${attr(b.cover)}" alt="Book cover">`:`<div class="book-cover-placeholder">${esc(b.title||'Untitled book')}</div>`}</div><div class="meta"><span class="pill">${b.visibility==='public'?'🌎 Public':'🔒 Only Me'}</span><span class="muted small">Page ${b.pageNumber||1} of ${b.chapters.length}</span></div><h3>${esc(b.title||'Untitled book')}</h3><p>${esc(b.description||'A story waiting for you.')}</p><button onclick="readBook('${b.id}')">Continue reading</button></div>`).join('')||`<div class="card empty muted">You haven't started a story yet.</div>`}</div></section><section class="home-section"><div class="home-section-head"><div><h2>My Library</h2><p class="muted">Stories you've saved. Saving a book does not start reading it.</p></div><button class="ghost" onclick="go('library')">View library →</button></div><div class="library-grid">${libraryBooks.map(publicBookCard).join('')||`<div class="card empty muted">Your library is empty. Add a story to keep it here.</div>`}</div></section><section class="home-section"><div class="home-section-head"><div><h2>Your little corner</h2><p class="muted">Small things you've left behind in Lumora.</p></div></div><div class="grid"><div class="card quick-card"><div class="quick-icon">📔</div><div><b>Diary</b><p class="muted small">${recentDiary?`Last entry: ${esc(recentDiary.title||'Untitled')}`:'Write down what today felt like.'}</p><button class="secondary" onclick="newDiary()">Write in diary</button></div></div><div class="card quick-card"><div class="quick-icon">💌</div><div><b>Thoughts</b><p class="muted small">${recentPost?`Last thought: ${esc((recentPost.content||'').slice(0,70))}${(recentPost.content||'').length>70?'…':''}`:'Leave a little thought for your future self.'}</p><button class="secondary" onclick="newPost()">Share a thought</button></div></div><div class="card quick-card"><div class="quick-icon">✦</div><div><b>Profile</b><p class="muted small">Make your corner of Lumora feel like yours.</p><button class="secondary" onclick="go('profile')">View profile</button></div></div></div></section><section class="home-section"><div class="home-note">“There is always room for one more story.”<br><span class="muted small">Your Lumora space is yours to fill, one page at a time.</span></div></section>`)}
async function news(){try{const x=await api('/api/feed');app.innerHTML=shell(`<section class="hero news-hero"><div class="hero-kicker">A little corner of today</div><h1>News Feed ✨</h1><p>Fresh public thoughts from the Lumora community. A public thought stays here for 24 hours before it moves quietly into your Archive Thoughts.</p><div class="archive-note">💌 <b>Share a Thought</b> whenever you want to leave a little piece of today behind. You choose who can see it.</div><button onclick="newPost()">💌 Share a Thought</button></section><div class="news-feed"><section class="section"><div class="home-section-head"><div><h2>Fresh Thoughts</h2><p class="muted">Public thoughts shared within the last 24 hours.</p></div></div>${x.posts.map(p=>`<div class="card news-post"><div class="meta"><span class="pill">💌 Public Thought</span><span class="muted small">by <span class="link" onclick="openUser('${p.author.id}')">@${esc(p.author.username)}</span></span><span class="muted small">${new Date(p.createdAt).toLocaleString()}</span></div><p class="post-body">${esc(p.content)}</p><p class="muted small">${p.commentCount||0} comment(s)</p><button onclick="openPost('${p.id}')">Open</button></div>`).join('')||'<div class="card empty muted">No fresh public thoughts right now.</div>'}</section></div>`)}catch(e){alert(e.message)}}
async function discover(){try{const x=await api('/api/discover/books');renderDiscovery(x)}catch(e){alert(e.message)}}
function renderDiscovery(x){const rec=x.recommendations||[];const groups=(x.genres||GENRES).map(g=>({genre:g,books:(x.books||[]).filter(b=>b.genre===g)})).filter(g=>g.books.length);app.innerHTML=shell(`<section class="hero"><h1>🔎 Discovery</h1><p>Discover public Books by genre, tags, title, or author.</p><div class="two-col"><div class="field"><label>Search Books</label><input id="dq" placeholder="Search title, author, tags..." onkeydown="if(event.key==='Enter')filterDiscovery()"></div><div class="field"><label>Genre</label><select id="dg"><option value="">All genres</option>${GENRES.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div></div><button onclick="filterDiscovery()">Find Books</button></section><div id="discoverResults">${rec.length?`<section class="section"><div class="home-section-head"><div><h2>Recommendation</h2><p class="muted">Stories surfaced from the available reader engagement and relevance data.</p></div></div><div class="discovery-grid">${rec.map(publicBookCard).join('')}</div></section>`:''}${groups.map(g=>`<section class="section"><div class="home-section-head"><h2>${esc(g.genre)}</h2></div><div class="discovery-grid">${g.books.map(publicBookCard).join('')}</div></section>`).join('')||(!rec.length?'<div class="card empty muted">No public books yet.</div>':'')}</div>`)}
async function filterDiscovery(){const q=document.getElementById('dq')?.value||'';const genre=document.getElementById('dg')?.value||'';try{const x=await api('/api/discover/books?q='+encodeURIComponent(q)+'&genre='+encodeURIComponent(genre));renderDiscovery(x)}catch(e){alert(e.message)}}
async function toggleLibrary(bookId,currently){try{await api('/api/library/'+bookId,{method:currently?'DELETE':'POST'});const x=await api('/api/library');state.libraryBooks=x.books||[];render()}catch(e){alert(e.message)}}
async function toggleFavorite(bookId,currently){try{const r=await api('/api/favorites/'+bookId,{method:currently?'DELETE':'POST'});if(state.view==='discover')return discover();if(state.view==='reader'&&state.book?.id===bookId){state.book.stats=r.stats;return render();}await dashboard();}catch(e){alert(e.message)}}
async function loadLibraryBooks(){try{const x=await api('/api/library');state.libraryBooks=x.books||[]}catch(e){state.libraryBooks=[]}}
function publicBookCard(b){const inLibrary=state.libraryBooks?.some(x=>x.id===b.id);const fav=!!b.stats?.favorited;const st=b.stats||{reads:0,libraryAdds:0,favorites:0};return `<div class="card book"><div class="book-cover">${b.cover?`<img src="${attr(b.cover)}" alt="${attr(b.title)} cover">`:`<div class="book-cover-placeholder">${esc(b.title)}</div>`}</div><div class="meta"><span class="pill">${esc(b.genre||'Book')}</span><span class="muted small">by <span class="link" onclick="openUser('${b.author.id}')">@${esc(b.author.username)}</span></span></div><h3>${esc(b.title)}</h3><p>${esc(b.description||'')}</p><div class="tags">${(b.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><p class="muted small book-stats">📖 ${st.reads} Reads · 📚 ${st.libraryAdds} Added to Library · ♥ ${st.favorites} Favorites</p><div class="row"><button onclick="readBook('${b.id}')">Read Book</button><button class="secondary" onclick="toggleFavorite('${b.id}',${fav})">${fav?'♥ Remove from Favorites':'♡ Add to Favorites'}</button>${b.author.id!==me?.id?`<button class="secondary" onclick="toggleLibrary('${b.id}',${inLibrary})">${inLibrary?'✓ In Library':'＋ Add to Library'}</button>`:''}</div></div>`}
async function chika(){try{const x=await api('/api/chika');const items=(x.diaries||[]).map(publicDiaryCard);app.innerHTML=shell(`<section class="hero"><h1>💬 Chika</h1><p>Diary entries from people you're allowed to see based on their privacy settings and your relationship with them.</p></section><div class="chika-feed">${items.join('')||'<div class="card empty muted">No diaries are available to you right now.</div>'}</div>`)}catch(e){alert(e.message)}}
function publicDiaryCard(x){return `<div class="card public-diary-card"><div class="diary-meta"><span class="pill">${diaryVisibilityLabel(x.visibility)}</span><span class="muted small">${esc(x.date)} · ${new Date(x.createdAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span></div><h3>${esc(x.title)}</h3><p class="muted">by <span class="link" onclick="openUser('${x.author.id}')">@${esc(x.author.username)}</span></p><div class="diary-meta">${x.mood?`<span class="pill">💭 ${esc(x.mood)}</span>`:''}${x.weather?`<span class="pill">${esc(x.weather)}</span>`:''}${x.season?`<span class="pill">🍃 ${esc(x.season)}</span>`:''}</div>${x.imageUrl?`<img class="diary-photo" src="${attr(x.imageUrl)}" alt="Diary photo">`:''}<p class="diary-body">${esc(x.content.slice(0,220))}${x.content.length>220?'…':''}</p><p class="muted small">${x.commentCount||0} comment(s)</p><button onclick="openDiary('${x.id}')">Read Diary</button></div>`}
async function library(){const d=state.data;app.innerHTML=shell(`<section class="hero"><h1>📚 My Books</h1><p>Your books and their chapters. Every page can have its own title — exactly as you type it.</p><button onclick="newBook()">＋ Create Book</button></section><div class="book-management-grid">${d.books.map(b=>`<div class="card"><div class="book-cover">${b.cover?`<img src="${attr(b.cover)}" alt="${attr(b.title)} cover">`:`<div class="book-cover-placeholder">${esc(b.title)}</div>`}</div><div class="meta"><span class="pill">${b.visibility==='public'?'🌎 Public':'🔒 Only Me'}</span><span class="pill">${esc(b.genre||'No genre')}</span></div><h3>${esc(b.title)}</h3><p>${esc(b.description||'')}</p><div class="tags">${(b.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><p class="muted small">${b.chapters.length} page(s)</p><p class="muted small book-stats">📖 ${b.stats?.reads||0} Reads · 📚 ${b.stats?.libraryAdds||0} Added to Library · ♥ ${b.stats?.favorites||0} Favorites</p><button onclick="readBook('${b.id}')">Read</button> <button class="secondary" onclick="editBook('${b.id}')">Edit</button> <button class="danger" onclick="moveToTrash('books','${b.id}')">Delete</button></div>`).join('')||'<div class="card empty muted">Create your first book.</div>'}</div>`)}
async function readBook(id){try{const x=await api('/api/books/'+id);state.book=x.book;const resume=state.data?.continueReading?.find(b=>b.id===id);const chapterId=resume?.chapterId||x.book.chapters?.[0]?.id;if(!chapterId)return;await openChapter(id,chapterId)}catch(e){alert(e.message)}}
async function openChapter(bookId,chapterId){try{const x=await api('/api/books/'+bookId+'/chapters/'+chapterId);state.book=x.book;state.chapter=x.chapter;state.chapterData=x;state.highlightVisible=false;state.view='reader';render()}catch(e){alert(e.message)}}
function highlightMarkup(text,highlights){let clean=String(text||'');const hs=(highlights||[]).filter(h=>Number.isFinite(h.start)&&Number.isFinite(h.end)&&h.start>=0&&h.end>h.start).sort((a,b)=>a.start-b.start);let out='',cursor=0;for(const h of hs){if(h.start<cursor)continue;out+=esc(clean.slice(cursor,h.start));out+=`<mark title="${attr(h.note||'Highlight')}">${esc(clean.slice(h.start,h.end))}</mark>`;cursor=h.end}out+=esc(clean.slice(cursor));return out}
function richStoryMarkup(c,highlights,showHighlights){const html=c.contentHtml||'';if(!showHighlights)return html||esc(c.content||'');if(!html)return highlightMarkup(c.content,highlights);const box=document.createElement('div');box.innerHTML=html;const hs=(highlights||[]).filter(h=>Number.isFinite(h.start)&&Number.isFinite(h.end)&&h.start>=0&&h.end>h.start).sort((a,b)=>a.start-b.start);if(!hs.length)return html;const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);let offset=0;for(const node of nodes){const text=node.nodeValue||'',start=offset,end=offset+text.length,ranges=hs.filter(x=>x.end>start&&x.start<end);if(ranges.length){let frag=document.createDocumentFragment(),cursor=0;for(const r of ranges){const a=Math.max(0,r.start-start),z=Math.min(text.length,r.end-start);if(a>cursor)frag.appendChild(document.createTextNode(text.slice(cursor,a)));const mark=document.createElement('mark');mark.title=r.note||'Highlight';mark.textContent=text.slice(a,z);frag.appendChild(mark);cursor=z}if(cursor<text.length)frag.appendChild(document.createTextNode(text.slice(cursor)));node.parentNode.replaceChild(frag,node)}offset=end}return box.innerHTML}
function reader(){const b=state.book,c=state.chapter,x=state.chapterData||{comments:[],highlights:[],bookmark:null};const i=b.chapters.findIndex(z=>z.id===c.id),prev=b.chapters[i-1],next=b.chapters[i+1];const visible=!!state.highlightVisible;app.innerHTML=shell(`<div class="reader story-reader" data-story-font="${attr(b.fontFamily||'Roboto')}"><div class="reader-header"><div class="meta"><span class="pill">${esc(b.genre||'Book')}</span>${(b.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><h1>${esc(c.title||'Untitled Page')}</h1><p class="muted">${esc(b.title)} · Page ${i+1} of ${b.chapters.length} · ${c.readCount||0} reads</p></div><div class="chapter-list card"><b>Chapters</b>${b.chapters.map(ch=>`<button class="${ch.id===c.id?'active':''}" onclick="openChapter('${b.id}','${ch.id}')">${esc(ch.title||'Untitled Page')} <span class="muted small">· ${ch.readCount||0} reads</span></button>`).join('')}</div><div class="reader-layout"><aside class="reader-actions"><button class="secondary back-btn" onclick="library()">← My Books</button><button onclick="highlightSelection()">🖍 Highlight selected text</button><button class="secondary" onclick="toggleHighlights()">✨ ${visible?'Hide Highlights':'Highlights'}</button><button class="secondary" onclick="bookmarkChapter()">${x.bookmark?'🔖 Remove Bookmark':'🔖 Bookmark page'}</button><button class="secondary" onclick="toggleFavorite('${b.id}',${!!b.stats?.favorited})">${b.stats?.favorited?'♥ Remove from Favorites':'♡ Add to Favorites'}</button><div class="book-stats reader-stats">📖 ${b.stats?.reads||0} Reads<br>📚 ${b.stats?.libraryAdds||0} Added to Library<br>♥ ${b.stats?.favorites||0} Favorites</div><button class="secondary" onclick="focusComment()">💬 Comment</button></aside><main class="reader-main"><article class="reader-paper"><div id="readerText" class="reader-content">${richStoryMarkup(c,x.highlights,visible)}</div></article><div class="chapter-nav">${prev?`<button class="secondary" onclick="openChapter('${b.id}','${prev.id}')">← ${esc(prev.title||'Previous')} · ${prev.readCount||0} reads</button>`:'<span></span>'}${next?`<button class="secondary" onclick="openChapter('${b.id}','${next.id}')">${esc(next.title||'Next')} · ${next.readCount||0} reads →</button>`:'<span></span>'}</div>${visible?`<div class="card highlights-panel"><div class="home-section-head"><div><h3>✨ Your Highlights</h3><p class="muted small">Private notes saved to this chapter.</p></div></div>${x.highlights.length?x.highlights.map(h=>`<div class="comment"><b>“${esc(h.text)}”</b>${h.note?`<p>${esc(h.note)}</p>`:''}<button class="secondary small" onclick="deleteHighlight('${h.id}')">Remove</button></div>`).join(''):'<p class="muted">No highlights yet.</p>'}</div>`:''}<div id="chapterComments" class="card section"><h3>Comments</h3>${commentsHTML(x.comments||[])}<div class="field"><textarea id="chapterComment" placeholder="Leave a comment about this page..."></textarea></div><button onclick="addComment('chapter','${c.id}','chapterComment')">Comment</button></div></main></div></div>`) }
function selectionOffsets(){const sel=window.getSelection();const root=document.getElementById('readerText');if(!sel||sel.rangeCount===0||!root||sel.isCollapsed)return null;const range=sel.getRangeAt(0);if(!root.contains(range.startContainer)||!root.contains(range.endContainer))return null;const before=range.cloneRange();before.selectNodeContents(root);before.setEnd(range.startContainer,range.startOffset);const start=before.toString().length;const selected=range.toString();return {start,end:start+selected.length,text:selected};}
async function highlightSelection(){const off=selectionOffsets();if(!off||!off.text.trim())return alert('Select a word or portion of the story first.');const note=prompt('Optional note for this highlight:')||'';try{await api('/api/highlights',{method:'POST',body:JSON.stringify({chapterId:state.chapter.id,text:off.text,start:off.start,end:off.end,note})});window.getSelection()?.removeAllRanges();await openChapter(state.book.id,state.chapter.id)}catch(e){alert(e.message)}}

function cancelComposer(btn){closeComposer(btn)}
function createMenu(){go('home')}
function newBook(existing){const b=existing||{title:'',description:'',genre:'',tags:[],visibility:'private',fontFamily:'Roboto',chapters:[{id:crypto.randomUUID(),title:'',content:'',contentHtml:''}]};const m=modal(`<h2>${existing?'Edit':'Create'} Book</h2><p class="muted">Type each page title exactly how you want it to appear. Formatting and font choices apply only to this Story Book.</p><div class="field"><label>Book Title</label><input id="bt" value="${attr(b.title)}"></div><div class="field"><label>Book Cover <span class="muted small">(optional)</span></label><input id="bookCoverFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewBookCover(this)"><div id="bookCoverPreview">${b.cover?`<img class="upload-preview" src="${attr(b.cover)}" alt="Book cover preview">`:''}</div><p class="upload-hint">Upload a cover image for your book. A portrait image works best.</p><input id="bc" value="${attr(b.cover||'')}" placeholder="Or paste a cover image URL (optional)"></div><div class="field"><label>Description</label><textarea id="bd">${esc(b.description)}</textarea></div><div class="field"><label>Genre</label><select id="bg"><option value="">Choose a genre</option>${GENRES.map(g=>`<option ${b.genre===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div><div class="field"><label>Tags</label><input id="btag" value="${attr((b.tags||[]).join(', '))}" placeholder="slowburn, fantasy, enemies-to-lovers"><p class="small muted">Separate tags with commas. # is optional.</p></div><div class="field"><label>Visibility</label><select id="bv"><option value="private" ${b.visibility==='private'?'selected':''}>Only Me</option><option value="public" ${b.visibility==='public'?'selected':''}>Public</option></select></div><div class="field"><label>Story Font</label><select id="bf">${['Roboto','Sans-serif','Arial','Calibri','Source Sans Pro','DM Pro'].map(f=>`<option value="${attr(f)}" ${storyFontCss(b.fontFamily)===storyFontCss(f)?'selected':''}>${f}</option>`).join('')}</select><p class="story-font-preview">This changes the font of this Story Book only.</p></div><h3>Pages / Chapters</h3><div id="chapters">${b.chapters.map((c,i)=>chapterHTML(c,i)).join('')}</div><button class="secondary" onclick="addChapter()">＋ Add Page / Chapter</button><br><br><button onclick="saveBook('${existing?.id||''}')">Save Book</button> <button class="danger" onclick="cancelComposer(this)">Cancel</button>` ,true);window.currentModal=m;window.currentBook=b} 
function chapterHTML(c,i){const html=c.contentHtml||esc(c.content||'');return `<div class="chapter-editor" draggable="true" data-chapter-id="${attr(c.id||'')}"><div class="row"><span class="drag-handle">☷</span><b class="page-number">Page ${i+1}</b><span class="muted small">(ordering only)</span><button type="button" class="secondary small" onclick="moveChapter(this,-1)">↑</button><button type="button" class="secondary small" onclick="moveChapter(this,1)">↓</button></div><div class="field"><label>Page / Chapter Title</label><input class="ct" placeholder="e.g. CHAPTER 1 — THE BEGINNING, Prologue, The Night We Met" value="${attr(c.title)}"></div><div class="field"><label>Story Text</label><div class="story-format-toolbar"><button type="button" class="secondary" onclick="formatStory('bold',this)"><b>B</b></button><button type="button" class="secondary" onclick="formatStory('italic',this)"><i>I</i></button><button type="button" class="secondary" onclick="formatStory('underline',this)"><u>U</u></button><button type="button" class="secondary" onclick="formatStory('removeFormat',this)">Normal</button></div><div class="story-editor" contenteditable="true">${html}</div></div></div>`}
function formatStory(command,btn){const editor=btn.closest('.chapter-editor')?.querySelector('.story-editor');if(!editor)return;editor.focus();document.execCommand(command,false,null)}
function storyEditorText(editor){return String(editor?.innerText||'').replace(/\u00a0/g,' ').replace(/\r\n/g,'\n').trim()}

function previewBookCover(input){const f=input.files&&input.files[0];if(!f)return;resizeImage(f,900,.66).then(src=>{const el=document.getElementById('bookCoverPreview');if(el)el.innerHTML=`<img class="upload-preview" src="${attr(src)}" alt="Book cover preview">`;}).catch(()=>alert('Could not read that image.'));}
function previewDiaryPhoto(input){const f=input.files&&input.files[0];if(!f)return;resizeImage(f,1200,.72).then(src=>{const el=document.getElementById('diaryPhotoPreview');if(el)el.innerHTML=`<img class="upload-preview" style="max-width:260px;max-height:220px;object-fit:contain" src="${attr(src)}" alt="Diary photo preview">`;}).catch(()=>alert('Could not read that image.'));}
function addChapter(){const box=currentModal.querySelector('#chapters');box.insertAdjacentHTML('beforeend',chapterHTML({title:'',content:''},box.children.length));updateChapterNumbers()}
function moveChapter(btn,dir){const box=currentModal.querySelector('#chapters');const item=btn.closest('.chapter-editor');if(dir<0&&item.previousElementSibling)box.insertBefore(item,item.previousElementSibling);if(dir>0&&item.nextElementSibling)box.insertBefore(item.nextElementSibling,item);updateChapterNumbers()}
function updateChapterNumbers(){currentModal.querySelectorAll('.chapter-editor').forEach((x,i)=>x.querySelector('.page-number').textContent='Page '+(i+1))}
async function saveBook(id){const chapters=[...currentModal.querySelectorAll('.chapter-editor')].map(x=>{const editor=x.querySelector('.story-editor');return {id:x.dataset.chapterId||crypto.randomUUID(),title:x.querySelector('.ct').value,content:storyEditorText(editor),contentHtml:editor?.innerHTML||''}});const tags=(document.getElementById('btag').value||'').split(',').map(x=>x.trim()).filter(Boolean);let cover=document.getElementById('bc')?.value.trim()||'';const f=document.getElementById('bookCoverFile')?.files?.[0];if(f)cover=await resizeImage(f,800,.62);const payload={title:bt.value,description:bd.value,genre:bg.value,tags,visibility:bv.value,cover,chapters,fontFamily:document.getElementById('bf').value};try{if(id)await api('/api/books/'+id,{method:'PUT',body:JSON.stringify(payload)});else await api('/api/books',{method:'POST',body:JSON.stringify(payload)});currentModal.remove();await dashboard()}catch(e){alert(e.message)}}

function editBook(id){const b=state.data.books.find(x=>x.id===id);newBook(b)}
function newDiary(existing){const x=existing||{title:'',mood:'',weather:'',season:'',content:'',visibility:'private',date:new Date().toISOString().slice(0,10)};const m=modal(`<h2>${existing?'Edit':'New'} Diary Entry</h2><p class="muted">Capture the little details of the day too.</p><div class="field"><label>Title</label><input id="dt" value="${attr(x.title)}"></div><div class="field"><label>Date</label><input id="dd" type="date" value="${attr(x.date)}"></div><div class="field"><label>Mood <span class="muted small">(optional)</span></label><input id="dm" value="${attr(x.mood)}" placeholder="e.g. Calm, Nostalgic, Loved"></div><div class="field"><label>Weather <span class="muted small">(optional)</span></label><select id="dw"><option value="">Choose weather</option>${WEATHER.map(w=>`<option value="${attr(w[0]+' '+w[1])}" ${x.weather===w[0]+' '+w[1]?'selected':''}>${w[0]} ${w[1]}</option>`).join('')}</select></div><div class="field"><label>Season <span class="muted small">(optional)</span></label><select id="ds"><option value="">Choose season</option>${SEASONS.map(s=>`<option ${x.season===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Photo <span class="muted small">(optional)</span></label><input id="diaryPhotoFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewDiaryPhoto(this)"><div id="diaryPhotoPreview">${x.imageUrl?`<img class="upload-preview" style="max-width:260px;max-height:220px;object-fit:contain" src="${attr(x.imageUrl)}" alt="Diary photo preview">`:''}</div><input id="dip" value="${attr(x.imageUrl||'')}" placeholder="Or paste a photo URL (optional)"></div><div class="field"><label>Entry</label><textarea id="dc">${esc(x.content)}</textarea></div><div class="field"><label>Who can see this?</label><select id="dv">${visibilityOptions(x.visibility)}</select></div><button onclick="saveDiary('${existing?.id||''}')">Save Entry</button> <button class="secondary" onclick="cancelComposer(this)">Cancel</button>`,true);window.currentDiary=x}
async function saveDiary(id){try{const returnToChika=state.view==='chika';let imageUrl=document.getElementById('dip')?.value.trim()||'';const f=document.getElementById('diaryPhotoFile')?.files?.[0];if(f)imageUrl=await resizeImage(f,1000,.62);const payload={title:dt.value,date:dd.value,mood:dm.value,weather:dw.value,season:ds.value,imageUrl,content:dc.value,visibility:dv.value};if(id)await api('/api/diaries/'+id,{method:'PUT',body:JSON.stringify(payload)});else await api('/api/diaries',{method:'POST',body:JSON.stringify(payload)});document.querySelector('.modal').remove();await dashboard();if(returnToChika){state.view='chika';await render()}}catch(e){alert(e.message)}}
function editDiary(id){const x=state.data.diaries.find(x=>x.id===id);newDiary(x)}
function newPost(existing){const p=existing||{content:'',visibility:'public'};const m=modal(`<h2>${existing?'Edit':'Share a Thought'}</h2><p class="muted">Public thoughts live in News Feed for 24 hours before moving to your Archive.</p><div class="field"><label>Your thought</label><textarea id="pc" placeholder="What are you thinking?">${esc(p.content)}</textarea></div><div class="field"><label>Who can see this?</label><select id="pv">${visibilityOptions(p.visibility)}</select></div><button onclick="savePost('${existing?.id||''}')">Save Thought</button> <button class="secondary" onclick="cancelComposer(this)">Cancel</button>`,true);window.currentPost=p}
async function savePost(id){try{const returnToNews=state.view==='news';const payload={content:pc.value,visibility:pv.value};if(id)await api('/api/posts/'+id,{method:'PUT',body:JSON.stringify(payload)});else await api('/api/posts',{method:'POST',body:JSON.stringify(payload)});document.querySelector('.modal').remove();await dashboard();if(returnToNews){state.view='news';await render()}}catch(e){alert(e.message)}}
function editPost(id){const p=state.data.posts.find(x=>x.id===id);newPost(p)}
function esc(s=''){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function attr(s=''){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/'/g,'&#39;')}
start().catch(e=>{console.error(e);auth()});


(function(){
  'use strict';
  const originalShell=window.shell, originalRender=window.render, originalReader=window.reader, originalNewBook=window.newBook;

  function truncateWords(text,max){const words=String(text||'').trim().split(/\s+/).filter(Boolean);return words.length<=max?words.join(' '):words.slice(0,max).join(' ')+'…'}
  function mentionText(text,mentions){
    let safe=esc(String(text||''));(Array.isArray(mentions)?mentions:[]).forEach(u=>{
      const username=String(u?.username||'').replace(/[.*+?^$()|[\]\\]/g,'\\$&');if(!username)return;
      safe=safe.replace(new RegExp('@'+username+'\\b','ig'),'<span class="mention-link" onclick="openUser(\''+attr(u.id)+'\')">@'+esc(u.username)+'</span>');
    });return safe;
  }
  function likeButton(type,id,liked,count){return '<button class="secondary like-btn" data-like-target="'+attr(type+':'+id)+'" onclick="toggleLike(\''+attr(type)+'\',\''+attr(id)+'\','+(liked?'true':'false')+',this)">'+(liked?'♥ Liked':'♡ Like')+' <span class="like-count">'+Number(count||0)+'</span></button>'}
  function socialPostCard(p){return '<div class="card news-post"><div class="meta"><span class="pill">💌 Public Thought</span><span class="muted small">by <span class="link" onclick="openUser(\''+attr(p.author.id)+'\')">@'+esc(p.author.username)+'</span></span><span class="muted small">'+new Date(p.createdAt).toLocaleString()+'</span></div><p class="post-body social-text">'+mentionText(p.content,p.mentions)+'</p><div class="social-actions">'+likeButton('post',p.id,p.liked,p.likesCount)+'<button class="secondary" onclick="openPost(\''+attr(p.id)+'\')">💬 '+Number(p.commentCount||0)+' Comments</button></div></div>'}
  function socialDiaryCard(x){return '<div class="card public-diary-card"><div class="diary-meta"><span class="pill">'+diaryVisibilityLabel(x.visibility)+'</span><span class="muted small">'+esc(x.date)+' · '+new Date(x.createdAt).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+'</span></div><h3>'+esc(x.title)+'</h3><p class="muted">by <span class="link" onclick="openUser(\''+attr(x.author.id)+'\')">@'+esc(x.author.username)+'</span></p><div class="diary-meta">'+(x.mood?'<span class="pill">💭 '+esc(x.mood)+'</span>':'')+(x.weather?'<span class="pill">'+esc(x.weather)+'</span>':'')+(x.season?'<span class="pill">🍃 '+esc(x.season)+'</span>':'')+'</div>'+(x.imageUrl?'<img class="diary-photo" src="'+attr(x.imageUrl)+'" alt="Diary photo" onclick="viewLumoraImage(this.src)">':'')+'<p class="diary-body social-text">'+mentionText(truncateWords(x.content,35),x.mentions)+'</p><div class="social-actions">'+likeButton('diary',x.id,x.liked,x.likesCount)+'<button class="secondary" onclick="openDiary(\''+attr(x.id)+'\')">💬 '+Number(x.commentCount||0)+' Comments</button></div></div>'}
  function socialBookCard(b){
    const inLibrary=state.libraryBooks?.some(x=>x.id===b.id),fav=!!b.stats?.favorited,st=b.stats||{reads:0,libraryAdds:0,favorites:0};
    return '<div class="card book"><div class="book-cover">'+(b.cover?'<img src="'+attr(b.cover)+'" alt="'+attr(b.title)+' cover" onclick="viewLumoraImage(this.src)">':'<div class="book-cover-placeholder">'+esc(b.title)+'</div>')+'</div><div class="meta"><span class="pill">'+esc(b.genre||'Book')+'</span><span class="muted small">by <span class="link" onclick="openUser(\''+attr(b.author.id)+'\')">@'+esc(b.author.username)+'</span></span></div><h3>'+esc(b.title)+'</h3><p>'+esc(truncateWords(b.description,33))+'</p><div class="tags">'+(b.tags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join('')+'</div><p class="muted small book-stats">📖 '+st.reads+' Reads · 📚 '+st.libraryAdds+' Added to Library · ♥ '+st.favorites+' Favorites</p><div class="row"><button onclick="readBook(\''+attr(b.id)+'\')">Read Book</button><button class="secondary" onclick="toggleFavorite(\''+attr(b.id)+'\','+(fav?'true':'false')+')">'+(fav?'♥ Remove from Favorites':'♡ Add to Favorites')+'</button>'+(b.author.id!==me?.id?'<button class="secondary" onclick="toggleLibrary(\''+attr(b.id)+'\','+(inLibrary?'true':'false')+')">'+(inLibrary?'✓ In Library':'＋ Add to Library')+'</button>':'')+'</div></div>'
  }
  window.publicBookCard=socialBookCard;window.publicDiaryCard=socialDiaryCard;
  window.shell=function(content){let out=originalShell(content);out=out.replace(/(<button[^>]*onclick="go\('settings'\)"[^>]*>⚙ Settings<\/button>)/,'<button class="'+(state.view==='inbox'?'active':'')+'" onclick="go(\\'inbox\\')">💌 Inbox</button>$1');out=out.replace(/(<input id="globalSearch"[^>]*value=")([^"]*)(")/,'$1$3');return out};
  window.render=async function(){if(state.view==='inbox')return renderInbox();return originalRender()};
  window.go=function(v){if(window.lumoraInboxTimer){clearTimeout(window.lumoraInboxTimer);window.lumoraInboxTimer=null}state.view=v;return window.render()};

  window.toggleLike=async function(type,id,liked){
    const buttons=[...document.querySelectorAll('[data-like-target="'+type+':'+id+'"]')];buttons.forEach(b=>b.disabled=true);
    try{const r=await api('/api/likes/'+type+'/'+id,{method:liked?'DELETE':'POST'});document.querySelectorAll('[data-like-target="'+type+':'+id+'"]').forEach(b=>{b.disabled=false;b.innerHTML=(r.liked?'♥ Liked':'♡ Like')+' <span class="like-count">'+Number(r.likesCount||0)+'</span>'})}
    catch(e){buttons.forEach(b=>b.disabled=false);alert(e.message)}
  };

  function currentCommentContext(){
    if(state.view==='post'&&state.postData?.post)return {type:'post',id:state.postData.post.id,open:()=>openPost(state.postData.post.id)};
    if(state.view==='diary'&&state.diaryData?.diary)return {type:'diary',id:state.diaryData.diary.id,open:()=>openDiary(state.diaryData.diary.id)};
    if(state.view==='reader'&&state.chapter?.id)return {type:'chapter',id:state.chapter.id,open:()=>openChapter(state.book.id,state.chapter.id)};
    return null;
  }
  function renderCommentTree(items){
    const byParent=new Map();(items||[]).forEach(c=>{const key=c.parentId||'root';if(!byParent.has(key))byParent.set(key,[]);byParent.get(key).push(c)});
    function branch(parentId){return (byParent.get(parentId||'root')||[]).map(c=>'<div class="comment" data-comment-id="'+attr(c.id)+'"><div><b>@'+esc(c.author?.username||'user')+'</b> <span class="muted small">'+new Date(c.createdAt).toLocaleString()+'</span></div><div class="social-text">'+mentionText(c.content,c.mentions)+'</div><button class="secondary comment-action" onclick="showReplyBox(\''+attr(c.id)+'\')">Reply</button>'+ (c.userId===me?.id?'<span class="muted small"> · You</span>':'') +'<div class="reply-thread">'+branch(c.id)+'</div></div>').join('')}
    return Array.isArray(items)&&items.length?branch(null):'<p class="muted">No comments yet.</p>';
  }
  window.commentsHTML=renderCommentTree;
  window.showReplyBox=function(commentId){
    document.querySelectorAll('.comment-compose').forEach(x=>x.remove());const host=document.querySelector('[data-comment-id="'+commentId+'"]');if(!host)return;
    const wrap=document.createElement('div');wrap.className='comment-compose mention-wrap';wrap.innerHTML='<textarea class="mention-enabled" rows="2" placeholder="Write a reply..."></textarea><div class="row"><button onclick="submitReply(\''+attr(commentId)+'\',this.closest(\\'.comment-compose\\').querySelector(\\'textarea\\'))">Reply</button><button class="secondary" onclick="this.closest(\\'.comment-compose\\').remove()">Cancel</button></div>';host.appendChild(wrap);attachMentionBox(wrap.querySelector('textarea'));wrap.querySelector('textarea').focus();
  };
  window.submitReply=async function(commentId,el){const ctx=currentCommentContext(),value=String(el?.value||'').trim();if(!ctx||!value)return;const btn=el.parentElement.querySelector('button');if(btn)btn.disabled=true;try{await api('/api/comments',{method:'POST',body:JSON.stringify({targetType:ctx.type,targetId:ctx.id,parentId:commentId,content:value})});ctx.open()}catch(e){if(btn)btn.disabled=false;alert(e.message)}};
  window.addComment=async function(type,id,field){const el=document.getElementById(field),value=String(el?.value||'').trim();if(!value)return;const btn=el?.closest('.field')?.nextElementSibling;if(btn)btn.disabled=true;try{await api('/api/comments',{method:'POST',body:JSON.stringify({targetType:type,targetId:id,content:value})});if(type==='post')openPost(id);else if(type==='chapter')openChapter(state.book.id,id);else openDiary(id)}catch(e){if(btn)btn.disabled=false;alert(e.message)}};

  window.news=async function(){try{const x=await api('/api/feed');app.innerHTML=shell('<section class="hero news-hero"><div class="hero-kicker">A little corner of today</div><h1>News Feed ✨</h1><p>Fresh public thoughts from the Lumora community. Public thoughts remain here for 24 hours before moving to your Archive.</p><div class="archive-note">💌 <b>Share a Thought</b> whenever you want to leave a little piece of today behind.</div><button onclick="newPost()">💌 Share a Thought</button></section><div class="news-feed"><section class="section"><div class="home-section-head"><div><h2>Fresh Thoughts</h2><p class="muted">Public thoughts shared within the last 24 hours.</p></div></div>'+((x.posts||[]).map(socialPostCard).join('')||'<div class="card empty muted">No fresh public thoughts right now.</div>')+'</section></div>');attachMentionBoxes()}catch(e){alert(e.message)}};
  window.chika=async function(){try{const x=await api('/api/chika');app.innerHTML=shell('<section class="hero"><h1>💬 Chika</h1><p>Diary entries only — shared according to each writer’s privacy settings.</p></section><div class="chika-feed">'+((x.diaries||[]).map(socialDiaryCard).join('')||'<div class="card empty muted">No diaries are available to you right now.</div>')+'</div>')}catch(e){alert(e.message)}};

  window.postPage=async function(){const x=state.postData;if(!x)return;const p=x.post;app.innerHTML=shell('<div class="card"><button class="secondary back-btn" onclick="go(\\'news\\')">← News Feed</button><div class="meta"><span class="pill">'+visibilityLabel(p.visibility)+'</span><span class="muted">'+new Date(p.createdAt).toLocaleString()+'</span></div><p class="post-body social-text">'+mentionText(p.content,p.mentions)+'</p><div class="social-actions">'+likeButton('post',p.id,p.liked,p.likesCount)+(p.userId===me.id?'<button class="secondary" onclick="editPost(\\''+attr(p.id)+'\\')">Edit</button>':'')+'</div><hr><h3>Comments</h3>'+commentsHTML(x.comments)+'<div class="field mention-wrap"><textarea id="postComment" class="mention-enabled" placeholder="Write a comment..."></textarea></div><button onclick="addComment(\\'post\\',\\''+attr(p.id)+'\\',\\'postComment\\')">Comment</button></div>');attachMentionBoxes()};
  window.diaryPage=async function(){const x=state.diaryData;if(!x)return;const d=x.diary;app.innerHTML=shell('<div class="card"><button class="secondary back-btn detail-back" onclick="go(\\'chika\\')">← Chika</button><div class="diary-detail-meta"><span class="pill">'+visibilityLabel(d.visibility)+'</span><span class="muted">'+esc(d.date)+' · '+new Date(d.createdAt).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+'</span></div><h1>'+esc(d.title)+'</h1><p class="muted">by @'+esc(d.author.username)+'</p><div class="diary-meta">'+(d.mood?'<span class="pill">💭 '+esc(d.mood)+'</span>':'')+(d.weather?'<span class="pill">'+esc(d.weather)+'</span>':'')+(d.season?'<span class="pill">🍃 '+esc(d.season)+'</span>':'')+'</div>'+(d.imageUrl?'<img class="diary-photo" src="'+attr(d.imageUrl)+'" alt="Diary photo" onclick="viewLumoraImage(this.src)">':'')+'<div class="diary-body section social-text">'+mentionText(d.content,d.mentions)+'</div>'+(d.userId===me.id?'<button class="secondary" onclick="editDiary(\\''+attr(d.id)+'\\')">Edit</button>':'')+'<div class="social-actions">'+likeButton('diary',d.id,d.liked,d.likesCount)+'</div><hr><h3>Comments</h3>'+commentsHTML(x.comments)+'<div class="field mention-wrap"><textarea id="diaryComment" class="mention-enabled" placeholder="Write a comment..."></textarea></div><button onclick="addComment(\\'diary\\',\\''+attr(d.id)+'\\',\\'diaryComment\\')">Comment</button></div>');attachMentionBoxes()};

  async function loadInbox(){const [m,s]=await Promise.all([api('/api/messages'),api('/api/social')]);return {conversations:m.conversations||[],requests:s.messageRequests||[]}}
  function inboxAvatar(u){return u?.avatarUrl?'<img class="inbox-avatar" src="'+attr(u.avatarUrl)+'" alt="">':'<div class="inbox-avatar">'+esc((u?.name||u?.username||'?')[0].toUpperCase())+'</div>'}
  function messageBubble(m){return '<div class="chat-bubble '+(m.fromId===me.id?'mine':'theirs')+'"><div>'+esc(m.content)+'</div><span class="small muted">'+new Date(m.createdAt).toLocaleString([], {hour:"numeric",minute:"short"})+'</span></div>'}
  async function renderInbox(selectedId){
    try{
      const data=await loadInbox();const selected=(data.conversations||[]).find(c=>c.user?.id===selectedId)||null;
      const sidebar=data.conversations.length?data.conversations.map(c=>'<div class="inbox-item '+(selected&&c.user.id===selected.user.id?'active':'')+'" onclick="openInboxChat(\''+attr(c.user.id)+'\')">'+inboxAvatar(c.user)+'<div class="inbox-preview"><b>'+esc(c.user.name||('@'+c.user.username))+'</b><div class="muted small">'+esc(c.lastMessage?.content||'')+'</div></div>'+(c.unreadCount?'<span class="inbox-unread">'+(c.unreadCount>99?'99+':c.unreadCount)+'</span>':'')+'</div>').join(''):'<div class="empty muted">No conversations yet.</div>';

  async function cropper(file,type){

    const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="modalbox"><h2>'+ (avatar?'Crop Profile Picture':'Crop Cover Photo')+'</h2><p class="muted">Drag to reposition and use the zoom slider.</p><div class="crop-stage-wrap"><canvas id="lumoraCropCanvas" class="crop-stage" width="'+W+'" height="'+H+'"></canvas></div><div class="crop-controls"><label>Zoom <input id="lumoraCropZoom" type="range" min="1" max="4" step=".01" value="1"></label><span id="lumoraCropZoomValue">1×</span></div><div class="row"><button id="lumoraCropSave">Use This Crop</button><button class="secondary" onclick="this.closest(\\'.modal\\').remove()">Cancel</button></div></div>';document.body.appendChild(m);

  }
